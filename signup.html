<title>K-GUIDE</title>
<script>
(function(){
  var W=390, H=844;
  function fit(){
    var s=document.querySelector('[data-screen-label]'); if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }
    s.style.transform='scale('+k+')'; s.style.margin='0';
  }
  var KB=false;
  document.addEventListener('focusin', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) KB=true; });
  document.addEventListener('focusout', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ KB=false; setTimeout(fit,50); } });
  var _fit=fit; fit=function(){ if(KB) return; _fit(); };
  document.addEventListener('DOMContentLoaded', fit);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>

  body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#111527}
  a{color:#3F52B4;text-decoration:none}
  ::-webkit-scrollbar{display:none}
  .sc{position:relative;width:390px;height:844px;margin:0 auto;background:#fff;overflow:hidden;display:flex;flex-direction:column}
  .hd{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;line-height:24px;color:#373B51}
  .hd a.bk{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
  .bd{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 16px 40px;display:flex;flex-direction:column;gap:16px}
  .hero{position:relative;flex-shrink:0;height:260px;overflow:hidden}
  .hero .img{position:absolute;inset:0;background:url('https://tong.visitkorea.or.kr/cms/resource_photo/62/4061962_image2_1.jpg') center / cover no-repeat}
  .hero .vl{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.70) 0%, rgba(255,255,255,1) 104%)}
  .hero .in{position:absolute;left:16px;right:16px;top:56px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .hero .ic{width:88px;height:88px;border-radius:44px;background:#F2F4FC;display:flex;align-items:center;justify-content:center}
  .hero h1{margin:0;font-size:20px;font-weight:700;text-align:center;color:#111527}
  .hero p{margin:0;font-size:14px;font-weight:500;line-height:1.7;text-align:center;color:#4B4F63}
  .sheet{position:relative;flex-shrink:0;border-radius:32px 32px 0 0;background:#fff;box-shadow:0 8px 32px rgba(131,139,180,.16);display:flex;flex-direction:column;flex:1;min-height:0}
  .sheet .grip{height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sheet .grip i{width:40px;height:4px;border-radius:100px;background:#D1D3DB;display:block}
  .sheet .in{padding:0 16px 34px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  label.f{display:flex;flex-direction:column;gap:6px}

  label.f>span em{font-style:normal;color:#9C9FAF;font-weight:500}
  .f input,.f textarea{width:100%;height:48px;border:0;box-shadow:inset 0 0 0 1px #E1E3EC;border-radius:14px;background:#fff;padding:0 14px;font-size:15px;font-family:inherit;color:#111527;outline:none}
  .f input:focus,.f textarea:focus{box-shadow:inset 0 0 0 2px #3F52B4}

  .f input[type=file]{padding:12px 14px;height:auto;font-size:13px;color:#4B4F63}
  .btn{width:100%;height:48px;border:0;border-radius:16px;background:#3F52B4;color:#fff;font-size:16px;font-weight:600;letter-spacing:.02em;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
  .btn:active{background:#323D76}
  .btn.ghost{background:#fff;color:#3F52B4;box-shadow:inset 0 0 0 1px #3F52B4}
  .btn.flat{background:#F2F4FC;color:#3F52B4}
  .btn.off{background:#F2F4FC;color:#9C9FAF;cursor:default}
  .btn.sm{height:40px;font-size:14px;border-radius:12px}

  .kv{display:flex;gap:8px;font-size:13px;line-height:1.6}
  .kv b{flex:0 0 82px;font-weight:600;color:#6B6E80}
  .kv span{flex:1;min-width:0;color:#373B51;word-break:break-all}

  .badge.g{background:#3F52B4;color:#fff}
  .badge.n{background:#EDEDF2;color:#6B6E80}
  .menu{display:flex;flex-direction:column;gap:12px}
  .menu a{min-height:60px;border-radius:16px;background:#F7F7FA;padding:8px 16px;display:flex;align-items:center;gap:16px}
  .menu a .ic{width:40px;height:40px;flex-shrink:0;border-radius:20px;background:#F2F4FC;display:flex;align-items:center;justify-content:center}
  .menu a .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .menu a .tx b{font-size:14px;font-weight:600;line-height:20px;color:#373B51}
  .menu a .tx i{font-style:normal;font-size:12px;line-height:16px;color:#4B4F63}
  .menu a .vl{font-size:14px;font-weight:600;color:#3F52B4;white-space:nowrap}
  .nav{position:absolute;left:0;right:0;bottom:0;height:98px;border-radius:16px 16px 0 0;background:#fff;box-shadow:0 8px 32px rgba(131,139,180,.16);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:6px 12px 0}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:8px}
  .nav a div{width:38px;height:38px;border-radius:48px;display:flex;align-items:center;justify-content:center}
  .nav a span{font-size:10px;font-weight:600;letter-spacing:.02em;color:#6B6E80}
  .nav a.on div{background:#F2F4FC}
  .nav a.on span{color:#3F52B4}
  .sp{height:4px}
</style>

<body>
<div class="stage">
<div class="sc" data-screen-label="アカウント作成">
  <div class="hd"><a class="bk" href="login.html"><k-icon name="ArrowRightSize24" size="24" style="color:#373B51;transform:rotate(180deg)"></k-icon></a>アカウント作成</div>
  <div class="bd">
    <div class="card">
      <h3>旅行者アカウント</h3>
      <div class="kv"><span style="color:#4B4F63">保存したスポットとルートが、機種を変えても残ります。見積もりの依頼にも使えます。</span></div>
    </div>
    <div id="msg" class="msg"></div>
    <label class="f"><span>お名前（表示名）</span><input id="nm" type="text" autocomplete="nickname" placeholder="たろう"></label>
    <label class="f"><span>メールアドレス</span><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></label>
    <label class="f"><span>パスワード <em>（6文字以上）</em></span><input id="pw" type="password" autocomplete="new-password" placeholder="••••••••"></label>
    <button class="btn" id="go">アカウントを作成</button>
    <div class="links"><a href="login.html">すでにアカウントをお持ちの方</a></div>
    <div class="links"><a href="guide-apply.html">ガイドの方はこちら</a></div>
  </div>
</div>
<script>
(function(){
  var msg=document.getElementById('msg'), go=document.getElementById('go');
  function say(t){ msg.textContent=t; msg.className='msg on'; }
  go.onclick=async function(){
    var nm=document.getElementById('nm').value.trim();
    var em=document.getElementById('em').value.trim();
    var pw=document.getElementById('pw').value;
    if(!em||!pw){ say('メールアドレスとパスワードを入力してください'); return; }
    if(pw.length<6){ say('パスワードは6文字以上にしてください'); return; }
    go.disabled=true; go.textContent='作成中…';
    try{
      await KGA.signUp(em,pw,{ display_name:nm, role:'traveler' });
      if(nm){ var u=await KGA.user(); if(u) await KGA.sb.from('profiles').update({display_name:nm}).eq('id',u.id); }
      await KGA.pull();
      location.replace('my.html');
    }catch(e){
      say(/already/i.test(e.message||'')?'このメールアドレスはすでに登録されています':(e.message||'作成できませんでした'));
      go.disabled=false; go.textContent='アカウントを作成';
    }
  };
})();
</script>
</div>
</body>
