<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3F52B4">
<title>K-GUIDE</title>
<style>
  html, body { margin:0; background:#F2F4FC; min-height:100%; }
</style>
<script>
(function(){
  var W=390, H=844;
  function fit(){
    var all=document.querySelectorAll('[data-screen-label]'), s=null;
    for(var i=0;i<all.length;i++){ if(!all[i].closest('x-dc')){ s=all[i]; break; } }
    if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }   /* 폰: 폭에 맞추고 세로는 화면 끝까지 */
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }  /* 패드·PC: 가운데에 폰 프레임 */
    s.style.transform='scale('+k+')';
    s.style.margin='0';
  }
  var mo=new MutationObserver(function(){ fit(); });
  document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); fit(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

<script src="https://kguide-rt.vercel.app/support.js"></script>
<script src="./data.js?v=1788815149"></script>
<script src="./kicon.js?v=1788815149"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap">
  <style>
    body { margin:0; background:#FAFAFA; font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:#111527; }
    a { color:#3F52B4; text-decoration:none; } a:hover { color:#323D76; }
    ::-webkit-scrollbar { display:none; }
  </style>
  
</helmet>
<div data-screen-label="プラン" style="position:relative; width:390px; height:844px; margin:0 auto; background:#fff; overflow:hidden; display:flex; flex-direction:column;">

  <div style="position:relative; flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:24px; padding-bottom:112px;">

    <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 16px 0;">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <div style="font-size:20px; font-weight:700; color:#111527;">9月8日（火）のプラン</div>
        <div style="font-size:12px; font-weight:500; color:#6B6E80;">ソウル · <span style="font-family:Poppins,sans-serif;">4</span>スポット</div>
      </div>
      <div style="display:flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:16px; background:#F2F4FC;"><k-icon name="RoutingSize24" size="24" style="color:#3F52B4"></k-icon></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; padding:0 16px;">
      <div style="font-size:16px; font-weight:700; color:#111527;">泊まるところ</div>
      <div style="border-radius:16px; background:#fff; box-shadow:0 2px 8px rgba(131,139,180,.12); padding:8px; display:flex; gap:12px;">
        <div style="width:96px; height:96px; flex-shrink:0; border-radius:8px; background:linear-gradient(180deg, rgba(17,21,41,0) 55%, rgba(17,21,41,0.55) 100%), url('https://tong.visitkorea.or.kr/cms/resource_photo/45/2588645_image2_1.jpg') center / cover no-repeat;"></div>
        <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; padding:4px 4px 4px 0;">
          <span style="align-self:flex-start; display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:8px; background:#F2F4FC; color:#3F52B4; font-size:11px; font-weight:600;">出発地点</span>
          <div style="font-size:16px; font-weight:700; color:#111527; line-height:1.35;">明洞のホテル</div>
          <div style="display:flex; align-items:center; gap:4px; font-size:12px; font-weight:500; color:#6B6E80;"><k-icon name="LocationSize14" size="14" style="color:#6B6E80"></k-icon>中区 明洞8길</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:center; height:40px; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1px #3F52B4; color:#3F52B4; font-size:14px; font-weight:600;">泊まるところを変える</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="position:relative; height:180px; margin:0 16px; border-radius:16px; overflow:hidden; background:#F2F4FC;">
        <div style="position:absolute; left:-60px; top:-174px; width:512px; height:512px; display:grid; grid-template-columns:256px 256px; grid-template-rows:256px 256px;">
          <div style="background:url('https://basemaps.cartocdn.com/light_all/15/27942/12693.png') center / 256px no-repeat;"></div>
          <div style="background:url('https://basemaps.cartocdn.com/light_all/15/27943/12693.png') center / 256px no-repeat;"></div>
          <div style="background:url('https://basemaps.cartocdn.com/light_all/15/27942/12694.png') center / 256px no-repeat;"></div>
          <div style="background:url('https://basemaps.cartocdn.com/light_all/15/27943/12694.png') center / 256px no-repeat;"></div>
        </div>
        <sc-for list="{{ pins }}" as="p" hint-placeholder-count="4">
          <div style="position:absolute; left:{{ p.x }}; top:{{ p.y }}; width:28px; height:28px; border-radius:50%; background:{{ p.color }}; color:#fff; font-family:Poppins,sans-serif; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(131,139,180,.12);">{{ p.n }}</div>
        </sc-for>
        <div style="position:absolute; left:16px; right:16px; bottom:14px; display:flex; align-items:center; justify-content:center; gap:6px; height:40px; border-radius:16px; background:#fff; color:#3F52B4; font-size:14px; font-weight:600; box-shadow:0 2px 8px rgba(131,139,180,.12);"><k-icon name="LocationSize18" size="18" style="color:#3F52B4"></k-icon>NAVER地図で開く</div>
      </div>
      <a href="{{ editHref }}" style="margin:0 16px; display:flex; align-items:center; justify-content:center; gap:6px; height:48px; border-radius:16px; background:{{ editBg }}; color:{{ editFg }}; box-shadow:{{ editRing }}; font-size:16px; font-weight:600; letter-spacing:.02em; text-decoration:none;"><k-icon name="{{ editIcon }}" size="20" style="color:{{ editFg }}"></k-icon>{{ editLabel }}</a>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; padding:0 16px;">
      <div style="display:flex; align-items:baseline; justify-content:space-between;">
        <div style="font-size:16px; font-weight:700; color:#111527;">今日のルート</div>
        <div style="font-size:12px; font-weight:500; color:#6B6E80;">合計 徒歩 <span style="font-family:Poppins,sans-serif;">38</span>分</div>
      </div>

      <sc-for list="{{ stops }}" as="s" hint-placeholder-count="4">
        <div style="display:flex; gap:12px;">
          <div style="width:28px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px;">
            <div style="width:28px; height:28px; border-radius:50%; background:#3F52B4; color:#fff; font-family:Poppins,sans-serif; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center;">{{ s.n }}</div>
            <div style="flex:1; width:0; border-left:2px dashed #D1D3DB;"></div>
          </div>
          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; padding-bottom:8px;">
            <div style="border-radius:16px; background:#fff; box-shadow:0 2px 8px rgba(131,139,180,.12); padding:8px; display:flex; gap:12px; align-items:center;">
              <div style="width:56px; height:56px; flex-shrink:0; border-radius:8px; background:{{ s.photo }};"></div>
              <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;">
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-family:Poppins,sans-serif; font-size:12px; font-weight:600; color:#3F52B4;">{{ s.time }}</span>
                  <span style="font-size:11px; font-weight:500; color:#6B6E80;">滞在 {{ s.stay }}</span>
                </div>
                <div style="font-size:16px; font-weight:700; color:#111527; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ s.name }}</div>
                <div style="font-size:11px; font-weight:600; color:#4B4F63;">{{ s.note }}</div>
              </div>
              <sc-if value="{{ editing }}" hint-placeholder-val="{{ false }}">
                <div style="width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:grab;">
                  <div style="display:grid; grid-template-columns:3px 3px; gap:4px;">
                    <span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span><span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span>
                    <span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span><span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span>
                    <span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span><span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span>
                  </div>
                </div>
                <div style="width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center;"><div style="width:28px; height:28px; border-radius:14px; background:#F7F7FA; display:flex; align-items:center; justify-content:center;"><k-icon name="MinusSize20" size="20" style="color:#B22459"></k-icon></div></div>
              </sc-if>
              <sc-if value="{{ notEditing }}" hint-placeholder-val="{{ true }}">
                <k-icon name="ArrowRightSize18" size="18" style="color:#9C9FAF"></k-icon>
              </sc-if>
            </div>
            <sc-if value="{{ s.hasLeg }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex; align-items:center; gap:8px; padding-left:4px; font-size:11px; font-weight:500; color:#6B6E80;">
                <k-icon name="ClockSize14" size="14" style="color:#9C9FAF"></k-icon>
                直線 <span style="font-family:Poppins,sans-serif; color:#111527;">{{ s.dist }}</span> · 徒歩 <span style="font-family:Poppins,sans-serif; color:#111527;">{{ s.walk }}</span>分
              </div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; flex-direction:column; gap:8px; padding:0 16px;">
      <div style="display:flex; align-items:center; justify-content:center; gap:6px; height:48px; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1px #3F52B4; color:#3F52B4; font-size:16px; font-weight:600; letter-spacing:.02em;"><k-icon name="MessagesSize24" size="20" style="color:#3F52B4"></k-icon>見積もりを依頼</div>
      <div style="text-align:center; font-size:11px; font-weight:500; color:#9C9FAF;">ガイドが順番と所要時間を確認して返信します</div>
    </div>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; height:98px; border-radius:16px 16px 0 0; background:#fff; box-shadow:0 8px 32px rgba(131,139,180,.16); display:grid; grid-template-columns:repeat(5,1fr); align-items:start; padding:6px 12px 0; box-sizing:border-box;">
    <a href="home.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="HomeSize24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">ホーム</span></a>
    <a href="search.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="SearchNormal2Size24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">さがす</span></a>
    <a href="plan.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; background:#F2F4FC; display:flex; align-items:center; justify-content:center;"><k-icon name="RoutingSize24" size="24" style="color:#3F52B4"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#3F52B4;">プラン</span></a>
    <a href="help.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="MessagesSize24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">ヘルプ</span></a>
    <a href="my.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="UserSize24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">マイページ</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;editing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;状態&quot;}}">
const WM = {"Bukchon-ro_11-gil_street_with_hanok_houses_and_blue_sky_in_Bukchon_Hanok_Village_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource/04/3304404_image2_1.jpg", "Bukchon-ro_11-gil_street_with_hanok_houses_at_sunrise_in_Bukchon_Hanok_Village_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource/04/3304404_image2_1.jpg", "Bukchon_Village_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource/04/3304404_image2_1.jpg", "Front_view_of_Heungnyemun_Gate_in_Gyeongbokgung_Palace_Seoul_South_Korea.jpg": "https://tong.visitkorea.or.kr/cms/resource/97/3487597_image2_1.jpg", "Front_view_of_the_Imperial_Throne_Hall_Geunjeongjeon_at_Gyeongbokgung_Palace_with_blue_sky_in_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource/97/3487597_image2_1.jpg", "Front_view_of_Jibokjae_Hall_under_blue_sky_at_Gyeongbokgung_Palace_in_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/62/4061962_image2_1.jpg", "Gwanghwamun_20240413.jpg": "https://tong.visitkorea.or.kr/cms/resource/88/3589188_image2_1.jpg", "Insadong_Street_in_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/87/2546387_image2_1.jpg", "Myeongdong_Cathedral_6.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/05/1939005_image2_1.jpg", "Myeongdong_at_night.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/45/2588645_image2_1.jpg", "Myeongdong_Neon_at_Night,_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/45/2588645_image2_1.jpg", "Tteokbokki.JPG": "https://tong.visitkorea.or.kr/cms/resource_photo/67/2540167_image2_1.jpg"};
const photo = (file) => `url('${WM[file] || ''}') center / cover no-repeat`;

class Component extends DCLogic {
  renderVals() {
    const editing = this.props.editing ?? false;
    return {
      editing,
      notEditing: !editing,
      editHref: editing ? 'plan.html' : 'plan-edit.html',
      editLabel: editing ? '完了' : 'ルートを決める',
      editIcon: editing ? 'TickCircleSize24' : 'RoutingSize24',
      editBg: editing ? '#fff' : '#3F52B4',
      editFg: editing ? '#3F52B4' : '#fff',
      editRing: editing ? 'inset 0 0 0 1px #3F52B4' : 'none',
      pins: [
        { n: 1, x: '58px', y: '52px', color: '#3F52B4' },
        { n: 2, x: '132px', y: '86px', color: '#3F52B4' },
        { n: 3, x: '216px', y: '58px', color: '#3F52B4' },
        { n: 4, x: '280px', y: '96px', color: '#3F52B4' },
      ],
      stops: [
        { n: 1, time: '09:30', stay: '90分', name: '景福宮', note: '日本語ガイドツアー 10:00', photo: photo('Gwanghwamun_20240413.jpg'), hasLeg: true, dist: '0.9km', walk: 12 },
        { n: 2, time: '11:20', stay: '60分', name: '北村韓屋村', note: '坂道あり · 歩きやすい靴で', photo: photo('Bukchon-ro_11-gil_street_with_hanok_houses_at_sunrise_in_Bukchon_Hanok_Village_Seoul.jpg'), hasLeg: true, dist: '0.6km', walk: 9 },
        { n: 3, time: '12:40', stay: '80分', name: '仁寺洞 · 昼ごはん', note: '日本語メニューあり', photo: photo('Bukchon_Village_Seoul.jpg'), hasLeg: true, dist: '1.4km', walk: 17 },
        { n: 4, time: '14:40', stay: '—', name: '明洞のホテルへ戻る', note: '地下鉄 3号線 → 4号線', photo: photo('Myeongdong_at_night.jpg'), hasLeg: false, dist: '', walk: '' },
      ],
    };
  }
}
</script>
</body>
</html>
