<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3F52B4">
<title>K-GUIDE</title>
<style>
  html, body { margin:0; background:#F2F4FC; min-height:100%; }
</style>
<script>
(function(){
  var W=390, H=844;
  function fit(){
    var all=document.querySelectorAll('[data-screen-label]'), s=null;
    for(var i=0;i<all.length;i++){ if(!all[i].closest('x-dc')){ s=all[i]; break; } }
    if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }   /* 폰: 폭에 맞추고 세로는 화면 끝까지 */
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }  /* 패드·PC: 가운데에 폰 프레임 */
    s.style.transform='scale('+k+')';
    s.style.margin='0';
  }
  var mo=new MutationObserver(function(){ fit(); });
  document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); fit(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

<script src="https://kguide-rt.vercel.app/support.js"></script>
<script src="./data.js"></script>

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap">
  <style>
    body { margin:0; background:#FAFAFA; font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:#111527; }
    a { color:#3F52B4; text-decoration:none; } a:hover { color:#323D76; }
    ::-webkit-scrollbar { display:none; }
  </style>
  <script src="./kicon.js"></script>
</helmet>
<div data-screen-label="ガイド紹介" style="position:relative; width:390px; height:844px; margin:0 auto; background:#fff; overflow:hidden; display:flex; flex-direction:column;">

  <div style="flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:24px; padding-bottom:110px;">

    <div style="position:relative; flex-shrink:0; padding:16px 16px 0;">
      <a href="home.html" style="width:48px; height:48px; border-radius:24px; background:#F2F4FC; display:flex; align-items:center; justify-content:center; text-decoration:none;"><k-icon name="ArrowRightSize24" size="24" style="color:#3F52B4; transform:scaleX(-1)"></k-icon></a>
      <div style="padding-top:16px; display:flex; flex-direction:column; align-items:center; gap:12px;">
        <div style="width:92px; height:92px; border-radius:73px; overflow:hidden; display:flex; align-items:center; justify-content:center;">
          <div style="width:80px; height:80px; border-radius:200px; background:url('./assets/avatar.png') center / cover no-repeat;"></div>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
          <div style="font-size:20px; font-weight:700; line-height:1.35; text-align:center; color:#111527;">キム・ソヌ</div>
          <div style="font-size:14px; font-weight:500; line-height:20px; text-align:center; color:#6B6E80;">김선우 · ソウル</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
          <span style="display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:8px; background:#3F52B4; color:#fff; font-size:11px; font-weight:600;"><k-icon name="TickCircleSize12" size="12" style="color:#fff"></k-icon>韓国政府公認ガイド · 日本語</span>
          <span style="display:inline-flex; align-items:center; height:22px; padding:0 8px; border-radius:8px; background:#F2F4FC; color:#3F52B4; font-size:11px; font-weight:600;">通訳ボランティア<span style="font-family:Poppins,'Noto Sans JP',sans-serif;">5</span>年</span>
        </div>
      </div>
    </div>

    <div style="margin:0 16px; flex-shrink:0; border-radius:16px; background:#F2F4FC; padding:16px; display:flex; flex-direction:column; gap:8px;">
      <div style="font-size:14px; font-weight:600; line-height:20px; color:#373B51;">はじめまして</div>
      <div style="font-size:14px; font-weight:500; line-height:1.7; color:#111527;">ソウル生まれ、日本語で <span style="font-family:Poppins,'Noto Sans JP',sans-serif; font-weight:600;">12</span>年ガイドをしています。宮殿と路地歩きが得意で、混む時間を避けた回り方をご案内します。<br>BBB で <span style="font-family:Poppins,'Noto Sans JP',sans-serif; font-weight:600;">5</span>年、病院やお店での通訳ボランティアも続けています。困ったときは遠慮なく LINE をください。</div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; padding:0 16px;">
      <div style="font-size:16px; font-weight:700; color:#111527;">できること</div>
      <sc-for list="{{ services }}" as="s" hint-placeholder-count="3">
        <div style="min-height:60px; flex-shrink:0; box-sizing:border-box; border-radius:16px; background:#F7F7FA; padding:8px 16px; display:flex; align-items:center; gap:8px;">
          <div style="width:40px; height:40px; flex-shrink:0; border-radius:20px; background:#F2F4FC; display:flex; align-items:center; justify-content:center;"><k-icon name="{{ s.icon }}" size="24" style="color:#3F52B4"></k-icon></div>
          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;">
            <div style="font-size:14px; font-weight:600; line-height:20px; color:#373B51;">{{ s.title }}</div>
            <div style="font-size:12px; font-weight:400; line-height:16px; color:#4B4F63;">{{ s.sub }}</div>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; padding:0 16px;">
      <div style="font-size:16px; font-weight:700; color:#111527;">対応エリア</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <sc-for list="{{ areas }}" as="a" hint-placeholder-count="4">
          <div style="display:inline-flex; align-items:center; height:38px; padding:0 16px; border-radius:38px; background:#fff; box-shadow:inset 0 0 0 1px #D1D3DB; color:#4B4F63; font-size:12px; font-weight:600;">{{ a }}</div>
        </sc-for>
      </div>
      <div style="font-size:11px; font-weight:500; line-height:1.6; color:#6B6E80;">上記以外のエリアもご相談ください。</div>
    </div>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; padding:12px 16px 20px; box-sizing:border-box; background:#fff; box-shadow:0 -8px 24px rgba(131,139,180,.10); display:flex; flex-direction:column; gap:6px;">
    <a href="help.html" style="display:flex; align-items:center; justify-content:center; gap:8px; height:48px; border-radius:16px; background:#3F52B4; color:#fff; font-size:16px; font-weight:600; letter-spacing:.02em; text-decoration:none;"><k-icon name="MessagesSize24" size="20" style="color:#fff"></k-icon>LINEで相談する</a>
    <div style="text-align:center; font-size:11px; font-weight:500; color:#6B6E80;">日本語で <span style="font-family:Poppins,'Noto Sans JP',sans-serif; font-weight:600;">24</span>時間以内に返信します</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return {
      services: [
        { icon: 'RoutingSize24', title: '案内', sub: '宮殿・路地歩き · 混む時間を避けた順番で' },
        { icon: 'TickCircleSize24', title: '予約代行', sub: '食堂・体験・入場チケットの予約を代わりに' },
        { icon: 'MessagesSize24', title: '通訳サポート', sub: '病院・タクシー・お店で日本語をつなぎます' },
      ],
      areas: ['明洞', '鍾路', '北村', '弘大'],
    };
  }
}
</script>
</body>
</html>
