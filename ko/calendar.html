<script>
(function(){
  var W=390, H=844;
  var KB=0, NAV=null;
  function navEl(){
    if(NAV && NAV.isConnected) return NAV;
    var d=document.getElementsByTagName('div');
    for(var i=0;i<d.length;i++){ var st=(d[i].getAttribute('style')||'').replace(/\s+/g,'');
      if(st.indexOf('height:98px')>=0 && st.indexOf('bottom:0')>=0){ NAV=d[i]; return NAV; } }
    return null;
  }
  function navHide(on){
    var n=navEl(); if(n){ if(on){ if(n.__d===undefined) n.__d=n.style.display; n.style.display='none'; } else if(n.__d!==undefined){ n.style.display=n.__d; } }
    var b=document.getElementById('kgline'); if(b) b.style.visibility = on ? 'hidden' : '';
  }
  function isField(t){ return t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable); }
  document.addEventListener('focusin', function(e){ if(!isField(e.target)) return; KB=1; navHide(1); });
  document.addEventListener('focusout', function(e){ if(!isField(e.target)) return; KB=0; setTimeout(function(){ if(!KB){ navHide(0); fit(); } }, 150); });
  function fit(){
    if(KB) return;
    var all=document.querySelectorAll('[data-screen-label]'), s=null;
    for(var i=0;i<all.length;i++){ if(!all[i].closest('x-dc')){ s=all[i]; break; } }
    if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }   /* 폰: 폭에 맞추고 세로는 화면 끝까지 */
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }  /* 패드·PC: 가운데에 폰 프레임 */
    s.style.transform='scale('+k+')';
    s.style.margin='0';
  }
  var mo=new MutationObserver(function(){ fit(); });
  document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); fit(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

const FAV = { get() { try { return JSON.parse(localStorage.getItem('kg_fav') || '[]'); } catch (e) { return []; } }, has(id) { return FAV.get().includes(id); }, toggle(id) { const l = FAV.get(); const i = l.indexOf(id); if (i >= 0) l.splice(i, 1); else l.unshift(id); try { localStorage.setItem('kg_fav', JSON.stringify(l)); } catch (e) {} return i < 0; } };

const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function closedOn(r, d) {
  r = r || ''; if (!r) return false;
  if (/年中無休|無休|年中開放|年中運航|休みなし/.test(r) && !/店舗により|一部/.test(r)) return false;
  const key = ymd(d), dow = DOWJ[d.getDay()], isHoli = KR_HOLI.has(key);
  const r1 = r.replace(/第\d月曜日?/g, ''), r2 = r1.replace(/[（(][^）)]*[）)]/g, '').replace(/[^、,／/]*祝日の(場合|次|翌|時)[^、,／/]*/g, '');
  const wd = new Set((r1.match(/[月火水木金土日](?=曜)/g) || [])); if (/週末/.test(r)) { wd.add('토'); wd.add('일'); }
  if (/祝日|公休日|祝祭日/.test(r2) && isHoli) return true;
  if (/1月1日/.test(r) && key.endsWith('-01-01')) return true;
  if (/12月25日/.test(r) && key.endsWith('-12-25')) return true;
  if (/5月1日/.test(r) && key.endsWith('-05-01')) return true;
  const run = /連休/.test(r);
  if (/ソルナル|ソルラル|旧正月|旧暦1月1日/.test(r) && (run ? SEOL.run : SEOL.day).includes(key)) return true;
  if (/秋夕|旧暦8月15日/.test(r) && (run ? CHUSEOK.run : CHUSEOK.day).includes(key)) return true;
  if (/第1月曜/.test(r) && dow === '월' && d.getDate() <= 7) { const ms = (r.match(/(\d{1,2})月/g) || []).map(x => parseInt(x)); if (!ms.length || ms.includes(d.getMonth() + 1)) return true; }
  if (wd.has(dow)) {
    if (/祝日の場合|祝日は開|祝日の時|祝日と重なる/.test(r) && isHoli) return false;   // 휴관요일이 공휴일이면 개관
    return true;
  }
  if (/翌日|翌平日|次の平日/.test(r)) { const y = new Date(d); y.setDate(y.getDate() - 1); if (wd.has(DOWJ[y.getDay()]) && KR_HOLI.has(ymd(y))) return true; }
  return false;
}

const WXTXT = (c) => c <= 2 ? '맑음' : c === 3 ? '흐림' : (c === 45 || c === 48) ? '안개' : ((c >= 71 && c <= 77) || c === 85 || c === 86) ? '눈' : '비';
const WEAR = (mx, pop) => { const w = mx >= 30 ? '햇빛 차단·수분 보충' : mx >= 20 ? '반팔＋얇은 겉옷' : mx >= 10 ? '겉옷 필수' : '코트·장갑'; return pop >= 50 ? '우산 ·' + w : w; };

function wxFetch(lat, lng) {
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia/Seoul&forecast_days=7`;

function monthGrid() {
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  let cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += '<div></div>';
  for (let d = 1; d <= last.getDate(); d++) {

      + '<span style="width:4px; height:4px; border-radius:50%; background:' + (holi ? (on ? '#fff' : '#B22459') : 'transparent') + ';"></span></div>';

  const head = ['일', '월', '화', '수', '목', '금', '토'].map((w, i) => '<div style="text-align:center; font-size:11px; font-weight:600; color:' + (i === 0 ? '#B22459' : '#6B6E80') + ';">' + w + '</div>').join('');

    + '<div data-mv="-1" style="padding:4px 12px; font-size:16px; font-weight:700; color:#3F52B4; cursor:pointer;">&#8249;</div>'
    + '<div style="font-family:Poppins,sans-serif; font-size:14px; font-weight:600; color:#111527;">' + y + '. ' + (m + 1) + '</div>'
    + '<div data-mv="1" style="padding:4px 12px; font-size:16px; font-weight:700; color:#3F52B4; cursor:pointer;">&#8250;</div></div>'
    + '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:4px;">' + head + '</div>'
    + '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:2px;">' + cells + '</div>'
    + '<div style="display:flex; align-items:center; gap:6px; padding-top:10px; font-size:10px; font-weight:500; color:#9C9FAF;"><span style="width:4px; height:4px; border-radius:50%; background:#B22459;"></span>한국의 공휴일</div>';
}

function render() {
  const tabs = [0, 1, 2].map(n => {
    const d = addD(n), on = same(d, sel);
    return '<div data-t="' + n + '" style="flex:1; height:38px; border-radius:12px; background:' + (on ? '#3F52B4' : '#F2F4FC') + '; color:' + (on ? '#fff' : '#4B4F63') + '; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; cursor:pointer;">' + ['오늘', '내일', '모레'][n] + '</div>';
  }).join('');
  const rj = (x) => x.restJa || x.rest;
  const shut = TARGET.filter(x => closedOn(rj(x), sel));
  const opens = TARGET.filter(x => !closedOn(rj(x), sel));
  const shown = moreOpen ? opens : opens.slice(0, 20);
  const lbl = dayLabel(sel);
  const sec = (title, n, body) => '<div style="display:flex; flex-direction:column; gap:12px;"><div style="display:flex; align-items:baseline; gap:8px; padding:0 16px;"><div style="font-size:18px; font-weight:700; color:#111527;">' + title + '</div><div style="font-family:Poppins,sans-serif; font-size:13px; font-weight:600; color:#6B6E80;">' + n + '</div></div><div style="display:flex; flex-direction:column; gap:8px; padding:0 16px;">' + body + '</div></div>';
  document.getElementById('cal-tabs').innerHTML = tabs;
  document.getElementById('cal-month').innerHTML = monthOpen ? monthGrid() : '';
  document.getElementById('cal-month').style.display = monthOpen ? 'block' : 'none';
  document.getElementById('cal-mcaret').textContent = monthOpen ? '닫기 ▲' : '열기 ▼';
  document.getElementById('cal-body').innerHTML =
    sec(lbl + '휴무인 곳', shut.length + '건', shut.length ? shut.map(x => card(x, true)).join('') : '<div style="padding:14px 16px; border-radius:16px; background:#F7F7FA; font-size:13px; font-weight:500; color:#4B4F63;">이 날 휴관하는 곳은 없습니다.</div>')
    + '<div style="height:8px;"></div>'
    + sec(lbl + '갈 수 있는 곳', opens.length + '건', shown.map(x => card(x, false)).join('')
        + (opens.length > shown.length ? '<div id="cal-more" style="height:44px; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1px #D1D3DB; color:#3F52B4; font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer;">더 보기(남은 ' + (opens.length - shown.length) + '건)</div>' : ''));
  document.title = lbl + '휴관일 | K-GUIDE';
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-t]'); if (t) { sel = addD(parseInt(t.dataset.t)); moreOpen = false; render(); return; }
  const d = e.target.closest('[data-d]'); if (d) { const p = d.dataset.d.split('-').map(Number); sel = new Date(p[0], p[1] - 1, p[2]); moreOpen = false; render(); return; }
  const mv = e.target.closest('[data-mv]'); if (mv) { cur = new Date(cur.getFullYear(), cur.getMonth() + parseInt(mv.dataset.mv), 1); render(); return; }
  if (e.target.closest('#cal-mtoggle')) { monthOpen = !monthOpen; if (monthOpen) cur = new Date(sel.getFullYear(), sel.getMonth(), 1); render(); return; }
  if (e.target.closest('#cal-more')) { moreOpen = true; render(); return; }
});
render();

</script>
