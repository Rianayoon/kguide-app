<script>
(function(){
  var W=390, H=844;
  function fit(){
    var s=document.querySelector('[data-screen-label]'); if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }
    s.style.transform='scale('+k+')'; s.style.margin='0';
  }
  var KB=false;
  document.addEventListener('focusin', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) KB=true; });
  document.addEventListener('focusout', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ KB=false; setTimeout(fit,50); } });
  var _fit=fit; fit=function(){ if(KB) return; _fit(); };
  document.addEventListener('DOMContentLoaded', fit);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

<body>
<div class="stage">
<div class="sc" data-screen-label="ログイン">
  <div class="hd"><a class="bk" href="home.html"><k-icon name="ArrowRightSize24" size="24" style="color:#373B51;transform:rotate(180deg)"></k-icon></a>ログイン</div>
  <div class="bd">
    <div class="card">
      <h3>ログイン</h3>
      <div class="kv"><span style="color:#4B4F63">見るだけならログインは不要です。保存したスポット・ルート・見積もりの依頼にログインが必要です。</span></div>
    </div>
    <div id="msg" class="msg"></div>
    <label class="f"><span>メールアドレス</span><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></label>
    <label class="f"><span>パスワード</span><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="btn" id="go">ログイン</button>
    <div class="links"><a href="reset.html">パスワードを忘れた方</a></div>
    <div style="display:flex;align-items:center;gap:10px;color:#9C9FAF;font-size:11px"><span style="flex:1;height:1px;background:#E1E3EC"></span>はじめての方<span style="flex:1;height:1px;background:#E1E3EC"></span></div>
    <a class="btn ghost" href="signup.html">新規登録（無料）</a>
    <button class="btn off" disabled><k-icon name="MessagesSize24" size="20" style="color:#9C9FAF"></k-icon>LINEでログイン（準備中）</button>
    <div class="links"><a href="guide-apply.html">ガイドの方はこちら</a></div>
    <div class="note">続けると <a href="#">利用規約</a> と <a href="#">プライバシーポリシー</a> に同意したことになります</div>
  </div>
</div>
<script>
(function(){
  var msg=document.getElementById('msg'), go=document.getElementById('go');
  function say(t){ msg.textContent=t; msg.className='msg on'; }
  function nextUrl(){ var q=new URLSearchParams(location.search); return q.get('next')||'my.html'; }
  KGA.session().then(function(s){ if(s) location.replace(nextUrl()); });
  go.onclick=async function(){
    var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
    if(!em||!pw){ say('メールアドレスとパスワードを入力してください'); return; }
    go.disabled=true; go.textContent='ログイン中…';
    try{
      await KGA.signIn(em,pw);
      var p=await KGA.profile(true);
      if(p&&p.role==='guide'&&p.status!=='approved'){ location.replace('guide-apply.html'); return; }
      location.replace(nextUrl());
    }catch(e){
      say(/Invalid login/i.test(e.message||'')?'メールアドレスまたはパスワードが違います':(e.message||'ログインできませんでした'));
      go.disabled=false; go.textContent='ログイン';
    }
  };
  document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });
})();
</script>
</div>
<script>
(function(){
  var U='https://line.me/R/ti/p/@897fvigb'; if(!U) return;
  var b=document.createElement('a'); b.href=U; b.target='_blank'; b.rel='noopener'; b.id='kgline';
  b.textContent='LINEで相談';
  b.style.cssText='position:absolute; right:16px; bottom:114px; z-index:700; display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 18px; border-radius:22px; background:#06C755; color:#fff; font-size:14px; font-weight:600; text-decoration:none; box-shadow:0 8px 32px rgba(17,21,41,.22);';
  function place(s){
    var sr=s.getBoundingClientRect(), top=sr.bottom;
    Array.prototype.forEach.call(s.children, function(c){
      if(c===b) return;
      var st=getComputedStyle(c); if(st.position!=='absolute'&&st.position!=='fixed') return;
      var r=c.getBoundingClientRect();
      if(r.height>0 && r.height<260 && r.bottom>sr.bottom-260 && r.bottom<=sr.bottom+2) top=Math.min(top, r.top);
    });
    b.style.bottom = Math.round(Math.max(16, sr.bottom-top+16)) + 'px';
  }
  function screenEl(){ var a=document.querySelectorAll('[data-screen-label]'), out=null;
    for(var i=0;i<a.length;i++){ if(a[i].closest('x-dc')) continue; var r=a[i].getBoundingClientRect(); if(r.width>0&&r.height>0) out=a[i]; }
    return out; }
  function mount(){ var s=screenEl(); if(!s) return; if(b.parentNode!==s) s.appendChild(b); place(s); }
  setInterval(mount, 700);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', function(){
    b.style.display = (window.visualViewport.height < window.innerHeight*0.75) ? 'none' : 'inline-flex'; }); }
})();
</script>
