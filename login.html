(function(){

    try{ return history.length > 1 && !!document.referrer && document.referrer.indexOf(location.origin) === 0; }catch(e){ return false; }
  }
  document.addEventListener('click', function(e){
    var el = backEl(e.target); if(!el) return;

    <button class="btn off" disabled><k-icon name="MessagesSize24" size="20" style="color:#9C9FAF"></k-icon>LINEでログイン（準備中）</button>
    <div class="links"><a href="guide-apply.html">ガイドの方はこちら</a></div>
    <div class="note">続けると <a href="#">利用規約</a> と <a href="#">プライバシーポリシー</a> に同意したことになります</div>
  </div>
</div>
<script>
(function(){
  var msg=document.getElementById('msg'), go=document.getElementById('go');
  function say(t){ msg.textContent=t; msg.className='msg on'; }
  function nextUrl(){ var q=new URLSearchParams(location.search); return q.get('next')||'my.html'; }
  KGA.session().then(function(s){ if(s) location.replace(nextUrl()); });
  go.onclick=async function(){
    var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
    if(!em||!pw){ say('メールアドレスとパスワードを入力してください'); return; }
    go.disabled=true; go.textContent='ログイン中…';
    try{
      await KGA.signIn(em,pw);
      var p=await KGA.profile(true);
      if(p&&p.role==='guide'&&p.status!=='approved'){ location.replace('guide-apply.html'); return; }
      location.replace(nextUrl());
    }catch(e){
      say(/Invalid login/i.test(e.message||'')?'メールアドレスまたはパスワードが違います':(e.message||'ログインできませんでした'));
      go.disabled=false; go.textContent='ログイン';
    }
  };
  document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });
})();
</script>
</div>
<script>
(function(){
  var U='https://line.me/R/ti/p/@897fvigb'; if(!U) return;
  var ID=(U.split('/').pop()||'').trim();
  var CHAT='https://line.me/R/oaMessage/'+ID+'/';
  var POSKEY='kg_line_pos';
  /* React 가 관리하는 화면 노드 안에 넣지 않는다. body 직속 고정 컨테이너에만 붙인다. (2026-09-09 핫픽스) */
  function host(){
    var h=document.getElementById('kg-overlay-top');
    if(!h){
      h=document.createElement('div'); h.id='kg-overlay-top';
      h.style.cssText='position:fixed; left:0; top:0; width:0; height:0; z-index:700; pointer-events:none;';
    }
    if(document.body && h.parentNode!==document.body) document.body.appendChild(h);
    return h;
  }
  var b=document.createElement('div'); b.id='kgline'; b.setAttribute('role','button'); b.setAttribute('tabindex','0');
  b.setAttribute('aria-label','LINEで相談');
  b.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.7L3 21l1.8-4.2A8.4 8.4 0 0 1 3 11.5C3 6.8 7 3 12 3s9 3.8 9 8.5z"/></svg><span style="font-size:9px;font-weight:700;letter-spacing:.5px;line-height:1;margin-top:1px">LINE</span>';
  b.style.cssText='position:fixed; right:16px; bottom:114px; z-index:700; pointer-events:auto; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; width:56px; height:56px; border-radius:50%; background:#06C755; color:#fff; text-decoration:none; box-shadow:0 8px 32px rgba(17,21,41,.22); touch-action:none; -webkit-user-select:none; user-select:none; transition:transform .12s ease;';

  /* ── 저장된 위치 ── */
  function loadPos(){ try{ var v=JSON.parse(localStorage.getItem(POSKEY)||'null'); if(v && (v.side==='l'||v.side==='r') && typeof v.y==='number') return v; }catch(e){} return null; }
  function savePos(v){ try{ localStorage.setItem(POSKEY, JSON.stringify(v)); }catch(e){} }
  var POS=loadPos();

  function screenEl(){ var a=document.querySelectorAll('[data-screen-label]'), out=null;
    for(var i=0;i<a.length;i++){ if(a[i].closest('x-dc')) continue; var r=a[i].getBoundingClientRect(); if(r.width>0&&r.height>0) out=a[i]; }
    return out; }
  function place(){
    if(dragging) return;
    var s=screenEl(); if(!s){ b.style.visibility='hidden'; return; }
    b.style.visibility='';
    var sr=s.getBoundingClientRect();
    if(POS){
      var maxY=window.innerHeight-56-16, minY=16;
      var y=Math.min(Math.max(POS.y, minY), maxY);
      b.style.top=Math.round(y)+'px'; b.style.bottom='auto';
      if(POS.side==='l'){ b.style.left=Math.round(Math.max(8, sr.left+16))+'px'; b.style.right='auto'; }
      else { b.style.right=Math.round(Math.max(8, window.innerWidth - sr.right + 16))+'px'; b.style.left='auto'; }
      return;
    }
    b.style.top='auto'; b.style.left='auto';
    var top=sr.bottom;
    Array.prototype.forEach.call(s.children, function(c){
      if(c===b) return;
      var st=getComputedStyle(c); if(st.position!=='absolute'&&st.position!=='fixed') return;
      var r=c.getBoundingClientRect();
      if(r.height>0 && r.height<260 && r.bottom>sr.bottom-260 && r.bottom<=sr.bottom+2) top=Math.min(top, r.top);
    });
    b.style.right  = Math.round(Math.max(8, window.innerWidth - sr.right + 16)) + 'px';
    b.style.bottom = Math.round(Math.max(16, window.innerHeight - top + 16)) + 'px';
  }

  /* ── 시트(짧게 탭) ── */
  var sheet=null;
  function closeSheet(){ if(sheet && sheet.parentNode) sheet.parentNode.removeChild(sheet); sheet=null; }
  function row(label, sub, color, bgc){
    return '<div class="kgl-row" data-act="'+label+'" style="display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:16px; background:'+bgc+'; cursor:pointer;">'
      + '<div style="flex:1; min-width:0; font-size:15px; font-weight:600; color:'+color+';">'+label+'</div>'
      + (sub?'<div style="font-size:12px; font-weight:600; color:#6B6E80;">'+sub+'</div>':'')
      + '</div>';
  }
  function openSheet(){
    if(sheet) return;
    sheet=document.createElement('div');
    sheet.style.cssText='position:fixed; left:0; top:0; right:0; bottom:0; z-index:900; pointer-events:auto; background:rgba(17,21,41,.40); display:flex; align-items:flex-end; justify-content:center;';
    sheet.innerHTML='<div id="kglpanel" style="width:100%; max-width:480px; box-sizing:border-box; background:#fff; border-radius:20px 20px 0 0; padding:16px 16px 24px; display:flex; flex-direction:column; gap:8px; box-shadow:0 -8px 40px rgba(17,21,41,.18);">'
      + '<div style="width:40px; height:4px; border-radius:2px; background:#E9ECF8; margin:0 auto 8px;"></div>'
      + '<div style="font-size:16px; font-weight:700; color:#111527; padding:0 2px 4px;">LINE</div>'
      + row('LINEでチャット','','#06C755','#F1FBF5')
      + row('友だち追加','','#111527','#F7F7FA')
      + row('IDをコピー', ID, '#111527','#F7F7FA')
      + '<div class="kgl-row" data-act="close" style="display:flex; align-items:center; justify-content:center; padding:14px; margin-top:4px; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1px #E9ECF8; color:#6B6E80; font-size:14px; font-weight:600; cursor:pointer;">閉じる</div>'
      + '<div style="text-align:center; font-size:11px; font-weight:500; color:#9C9FAF; padding-top:6px;">長押しで移動できます</div>'
      + '</div>';
    host().appendChild(sheet);
    sheet.addEventListener('click', function(e){
      var r=e.target.closest('.kgl-row');
      if(!r){ if(e.target===sheet) closeSheet(); return; }
      var act=r.getAttribute('data-act');
      if(act==='close'){ closeSheet(); return; }
      if(act==='IDをコピー'){
        var done=function(){ var d=r.querySelector('div:last-child'); if(d) d.textContent='コピーしました'; setTimeout(closeSheet, 700); };
        try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ID).then(done, done); return; } }catch(x){}
        var ta=document.createElement('textarea'); ta.value=ID; ta.style.cssText='position:fixed;opacity:0;'; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(x){}
        document.body.removeChild(ta); done(); return;
      }
      var url = (act==='LINEでチャット') ? CHAT : U;
      closeSheet();
      window.open(url, '_blank', 'noopener');
    });
  }

  /* ── 길게 눌러 이동 ── */
  var dragging=false, moved=false, pressing=false, timer=null, sx=0, sy=0, ox=0, oy=0, pid=null;
  function startDrag(){
    dragging=true; moved=false;
    b.style.transform='scale(1.12)';
    b.style.boxShadow='0 12px 40px rgba(17,21,41,.32)';
    try{ if(navigator.vibrate) navigator.vibrate(30); }catch(e){}
    var r=b.getBoundingClientRect();
    b.style.left=Math.round(r.left)+'px'; b.style.top=Math.round(r.top)+'px'; b.style.right='auto'; b.style.bottom='auto';
    ox=r.left; oy=r.top;
  }
  function onDown(e){
    if(sheet) return;
    if(e.button !== undefined && e.button !== 0) return;
    pressing=true; moved=false; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
    try{ if(b.setPointerCapture && pid!==undefined) b.setPointerCapture(pid); }catch(x){}
    clearTimeout(timer); timer=setTimeout(startDrag, 500);
  }
  function onMove(e){
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!dragging){ if(pressing && (Math.abs(dx)>10||Math.abs(dy)>10)) clearTimeout(timer); return; }
    if(e.cancelable) e.preventDefault();
    moved=true;
    var x=Math.min(Math.max(ox+dx, 4), window.innerWidth-60);
    var y=Math.min(Math.max(oy+dy, 4), window.innerHeight-60);
    b.style.left=Math.round(x)+'px'; b.style.top=Math.round(y)+'px';
  }
  function onUp(e){
    clearTimeout(timer); pressing=false;
    try{ if(b.releasePointerCapture && pid!==null && pid!==undefined) b.releasePointerCapture(pid); }catch(x){}
    pid=null;
    if(!dragging) return;
    dragging=false;
    b.style.transform='';
    b.style.boxShadow='0 8px 32px rgba(17,21,41,.22)';
    var r=b.getBoundingClientRect();
    var side = (r.left + r.width/2) < window.innerWidth/2 ? 'l' : 'r';
    /* 하단 탭바·헤더와 겹치지 않게 */
    var y=Math.min(Math.max(r.top, 72), Math.max(72, window.innerHeight-56-116));
    POS={side:side, y:y}; savePos(POS); place();
  }
  if(window.PointerEvent){
    b.addEventListener('pointerdown', onDown);
    b.addEventListener('pointermove', onMove, {passive:false});
    b.addEventListener('pointerup', onUp);
    b.addEventListener('pointercancel', onUp);
    b.addEventListener('lostpointercapture', function(){ if(dragging) onUp({}); });
  } else {
    b.addEventListener('mousedown', function(e){ onDown(e); document.addEventListener('mousemove', onMove, {passive:false}); document.addEventListener('mouseup', up1, true); });
    var up1=function(e){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', up1, true); onUp(e); };
    b.addEventListener('touchstart', function(e){ onDown(e.touches[0]); }, {passive:true});
    b.addEventListener('touchmove', function(e){ onMove(e.touches[0]); }, {passive:false});
    b.addEventListener('touchend', onUp);
    b.addEventListener('touchcancel', onUp);
  }
  /* 누르고 있는 동안 브라우저의 「끌어서 놓기」가 끼어들지 않게 */
  document.addEventListener('dragstart', function(e){ if(pressing||dragging){ e.preventDefault(); } }, true);
  b.setAttribute('draggable','false');
  b.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });
  b.addEventListener('selectstart', function(e){ e.preventDefault(); });
  b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    if(moved){ moved=false; return; }
    openSheet();
  });
  b.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openSheet(); } });

  function mount(){ var h=host(); if(b.parentNode!==h) h.appendChild(b); place(); }
  setInterval(mount, 700);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  window.addEventListener('resize', place);
  window.addEventListener('scroll', place, true);
  window.addEventListener('pagehide', closeSheet);
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', function(){
    b.style.display = (window.visualViewport.height < window.innerHeight*0.75) ? 'none' : 'inline-flex'; }); }
})();
</script>
</body>
