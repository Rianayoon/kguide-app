<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3F52B4">
<title>K-GUIDE</title>
<script>
(function(){
  var W=390, H=844;
  function fit(){
    var s=document.querySelector('[data-screen-label]'); if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }
    s.style.transform='scale('+k+')'; s.style.margin='0';
  }
  var KB=false;
  document.addEventListener('focusin', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) KB=true; });
  document.addEventListener('focusout', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ KB=false; setTimeout(fit,50); } });
  var _fit=fit; fit=function(){ if(KB) return; _fit(); };
  document.addEventListener('DOMContentLoaded', fit);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#F2F4FC;min-height:100%}
  body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#111527}
  a{color:#3F52B4;text-decoration:none}
  ::-webkit-scrollbar{display:none}
  .sc{position:relative;width:390px;height:844px;margin:0 auto;background:#fff;overflow:hidden;display:flex;flex-direction:column}
  .hd{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;line-height:24px;color:#373B51}
  .hd a.bk{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
  .bd{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 16px 40px;display:flex;flex-direction:column;gap:16px}
  label.f{display:flex;flex-direction:column;gap:6px}
  label.f>span{font-size:12px;font-weight:600;line-height:16px;color:#4B4F63}
  label.f>span em{font-style:normal;color:#9C9FAF;font-weight:500}
  .f input{width:100%;height:48px;border:0;box-shadow:inset 0 0 0 1px #E1E3EC;border-radius:14px;background:#fff;padding:0 14px;font-size:15px;font-family:inherit;color:#111527;outline:none}
  .f input:focus{box-shadow:inset 0 0 0 2px #3F52B4}
  .btn{width:100%;height:48px;border:0;border-radius:16px;background:#3F52B4;color:#fff;font-size:16px;font-weight:600;letter-spacing:.02em;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
  .btn:active{background:#323D76}
  .btn[disabled]{opacity:.55;cursor:default}
  .msg{display:none;font-size:13px;font-weight:600;line-height:1.6;border-radius:12px;padding:10px 12px;background:#F2F4FC;color:#323D76}
  .msg.on{display:block}
  .links{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600;color:#3F52B4}
  .card{border-radius:16px;background:#F7F7FA;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .card h3{margin:0;font-size:15px;font-weight:700;color:#111527}
  .kv{display:flex;gap:8px;font-size:13px;line-height:1.6}
  .kv span{flex:1;min-width:0;color:#373B51}
</style>
<script src="./kicon.js?v=1789000000"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./auth.js?v=1789000000"></script>
</head>
<body>
<div class="stage">
<div class="sc" data-screen-label="パスワード再設定">
  <div class="hd"><a class="bk" href="login.html"><k-icon name="ArrowRightSize24" size="24" style="color:#373B51;transform:rotate(180deg)"></k-icon></a>パスワード再設定</div>
  <div class="bd">
    <div id="step1">
      <div class="card">
        <h3>パスワードをお忘れの方</h3>
        <div class="kv"><span style="color:#4B4F63">登録したメールアドレスにリセット用リンクを送ります。</span></div>
      </div>
      <div style="height:14px"></div>
      <div id="msg1" class="msg"></div>
      <label class="f"><span>メールアドレス</span><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></label>
      <div style="height:14px"></div>
      <button class="btn" id="send">リセットメールを送る</button>
      <div style="height:14px"></div>
      <div class="links"><a href="login.html">ログインに戻る</a></div>
    </div>
    <div id="step2" style="display:none">
      <div class="card">
        <h3>新しいパスワード</h3>
        <div class="kv"><span style="color:#4B4F63">新しいパスワードを入力してください。</span></div>
      </div>
      <div style="height:14px"></div>
      <div id="msg2" class="msg"></div>
      <label class="f"><span>新しいパスワード <em>（6文字以上）</em></span><input id="pw1" type="password" autocomplete="new-password" placeholder="••••••••"></label>
      <div style="height:10px"></div>
      <label class="f"><span>新しいパスワード（確認）</span><input id="pw2" type="password" autocomplete="new-password" placeholder="••••••••"></label>
      <div style="height:14px"></div>
      <button class="btn" id="upd">パスワードを更新</button>
    </div>
  </div>
</div>
<script>
(function(){
  var step1=document.getElementById('step1'), step2=document.getElementById('step2');
  var msg1=document.getElementById('msg1'), msg2=document.getElementById('msg2');
  var send=document.getElementById('send'), upd=document.getElementById('upd');
  function say(el,t){ el.textContent=t; el.className='msg on'; }
  send.onclick=async function(){
    var em=document.getElementById('em').value.trim();
    if(!em){ say(msg1,'メールアドレスを入力してください'); return; }
    send.disabled=true; send.textContent='送信中…';
    try{
      await KGA.sendReset(em);
      say(msg1,'メールを送信しました。届いたリンクからこのページに戻ってきてください');
      send.textContent='送信しました';
    }catch(e){
      say(msg1, e.message||'送信できませんでした');
      send.disabled=false; send.textContent='リセットメールを送る';
    }
  };
  upd.onclick=async function(){
    var pw1=document.getElementById('pw1').value, pw2=document.getElementById('pw2').value;
    if(!pw1||pw1.length<6){ say(msg2,'パスワードは6文字以上にしてください'); return; }
    if(pw1!==pw2){ say(msg2,'パスワードが一致しません'); return; }
    upd.disabled=true; upd.textContent='更新中…';
    try{
      await KGA.setPassword(pw1);
      say(msg2,'パスワードを更新しました。まもなくマイページに移動します');
      setTimeout(function(){ location.replace('my.html'); }, 1500);
    }catch(e){
      say(msg2, e.message||'更新できませんでした');
      upd.disabled=false; upd.textContent='パスワードを更新';
    }
  };
  function showStep2(){ step1.style.display='none'; step2.style.display='block'; }
  if(/type=recovery/.test(location.hash)) showStep2();
  document.addEventListener('DOMContentLoaded', function(){
    if(window.supabase && KGA && KGA.sb){
      KGA.sb.auth.onAuthStateChange(function(ev){ if(ev==='PASSWORD_RECOVERY') showStep2(); });
    }
  });
})();
</script>
</div>
</body>
</html>
