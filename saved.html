(function () {
  if (window.__kgGuard) return; window.__kgGuard = 1;
  function warn(m) { try { console.warn('[kg-guard] ' + m); } catch (e) { } }
  var RE = /removeChild|insertBefore|replaceChild|not a child of this node|NotFoundError|HierarchyRequestError/;
  var _rc = Node.prototype.removeChild, _ib = Node.prototype.insertBefore;
  Node.prototype.removeChild = function (child) {
    if (child && child.parentNode !== this) {

  function killOverlay() {
    if (!document.body) return;
    var t0 = document.body.textContent || '';
    if (t0.indexOf('not a child of this node') < 0 && t0.indexOf('removeChild') < 0) return;
    var a = document.body.querySelectorAll('div,pre,section,aside');
    for (var i = 0; i < a.length; i++) {
      var el = a[i]; if (el.id === 'kg-overlay-top') continue;
      var t = el.textContent || ''; if (t.length > 800 || !RE.test(t)) continue;
      if (el.querySelector && el.querySelector('[data-screen-label]')) continue;
      try { el.parentNode && _rc.call(el.parentNode, el); warn('overlay removed'); } catch (e) { }

})();

<script>
/* 앱 안 「←」 버튼: 히스토리가 있으면 진짜 뒤로가기, 없으면 링크대로. (2026-09-09) */
(function(){
  function backEl(t){
    if(!t || !t.closest) return null;
    var k = t.closest('k-icon');
    if(!k){ var d = t.closest('a,div'); if(d) k = d.querySelector(':scope > k-icon'); }

    if((k.getAttribute('name')||'') !== 'ArrowRightSize24') return null;
    if(((k.getAttribute('style')||'').indexOf('scaleX(-1)')) < 0) return null;
    var el = k.parentElement; if(!el) return null;
    if(el.hasAttribute && el.hasAttribute('data-kgnoback')) return null;
    return el;
  }
  function canBack(){
    try{ return history.length > 1 && !!document.referrer && document.referrer.indexOf(location.origin) === 0; }catch(e){ return false; }
  }
  document.addEventListener('click', function(e){
    var el = backEl(e.target); if(!el) return;
    if(window.__kgGalClose) { try{ window.__kgGalClose(); }catch(x){} }
    if(!canBack()){
      var a = el.closest('a[href]');
      if(!a){ e.preventDefault(); location.href = (el.getAttribute('data-kgbackto') || 'home.html'); }
      return;
    }
    e.preventDefault(); e.stopPropagation();
    try{ history.back(); }catch(x){ }
  }, true);
})();

    b.addEventListener('pointerdown', onDown);
    b.addEventListener('pointermove', onMove, {passive:false});
    b.addEventListener('pointerup', onUp);
    b.addEventListener('pointercancel', onUp);
    b.addEventListener('lostpointercapture', function(){ if(dragging) onUp({}); });
  } else {
    b.addEventListener('mousedown', function(e){ onDown(e); document.addEventListener('mousemove', onMove, {passive:false}); document.addEventListener('mouseup', up1, true); });
    var up1=function(e){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', up1, true); onUp(e); };
    b.addEventListener('touchstart', function(e){ onDown(e.touches[0]); }, {passive:true});
    b.addEventListener('touchmove', function(e){ onMove(e.touches[0]); }, {passive:false});
    b.addEventListener('touchend', onUp);
    b.addEventListener('touchcancel', onUp);
  }
  /* 누르고 있는 동안 브라우저의 「끌어서 놓기」가 끼어들지 않게 */
  document.addEventListener('dragstart', function(e){ if(pressing||dragging){ e.preventDefault(); } }, true);
  b.setAttribute('draggable','false');
  b.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });
  b.addEventListener('selectstart', function(e){ e.preventDefault(); });
  b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    if(moved){ moved=false; return; }
    openSheet();
  });
  b.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openSheet(); } });

  function mount(){ var h=host(); if(b.parentNode!==h) h.appendChild(b); place(); }
  setInterval(mount, 700);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  window.addEventListener('resize', place);
  window.addEventListener('scroll', place, true);
  window.addEventListener('pagehide', closeSheet);
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', function(){
    b.style.display = (window.visualViewport.height < window.innerHeight*0.75) ? 'none' : 'inline-flex'; }); }
})();
</script>
</body>
</html>
