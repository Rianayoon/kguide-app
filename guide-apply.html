<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3F52B4">
<title>K-GUIDE</title>
<script>
(function(){
  var W=390, H=844;
  function fit(){
    var s=document.querySelector('[data-screen-label]'); if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }
    s.style.transform='scale('+k+')'; s.style.margin='0';
  }
  var KB=false;
  document.addEventListener('focusin', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) KB=true; });
  document.addEventListener('focusout', function(e){ if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){ KB=false; setTimeout(fit,50); } });
  var _fit=fit; fit=function(){ if(KB) return; _fit(); };
  document.addEventListener('DOMContentLoaded', fit);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#F2F4FC;min-height:100%}
  body{font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#111527}
  a{color:#3F52B4;text-decoration:none}
  ::-webkit-scrollbar{display:none}
  .sc{position:relative;width:390px;height:844px;margin:0 auto;background:#fff;overflow:hidden;display:flex;flex-direction:column}
  .hd{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;font-size:16px;font-weight:600;line-height:24px;color:#373B51}
  .hd a.bk{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
  .bd{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 16px 40px;display:flex;flex-direction:column;gap:16px}
  .hero{position:relative;flex-shrink:0;height:260px;overflow:hidden}
  .hero .img{position:absolute;inset:0;background:url('https://tong.visitkorea.or.kr/cms/resource_photo/62/4061962_image2_1.jpg') center / cover no-repeat}
  .hero .vl{position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.70) 0%, rgba(255,255,255,1) 104%)}
  .hero .in{position:absolute;left:16px;right:16px;top:56px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .hero .ic{width:88px;height:88px;border-radius:44px;background:#F2F4FC;display:flex;align-items:center;justify-content:center}
  .hero h1{margin:0;font-size:20px;font-weight:700;text-align:center;color:#111527}
  .hero p{margin:0;font-size:14px;font-weight:500;line-height:1.7;text-align:center;color:#4B4F63}
  .sheet{position:relative;flex-shrink:0;border-radius:32px 32px 0 0;background:#fff;box-shadow:0 8px 32px rgba(131,139,180,.16);display:flex;flex-direction:column;flex:1;min-height:0}
  .sheet .grip{height:32px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sheet .grip i{width:40px;height:4px;border-radius:100px;background:#D1D3DB;display:block}
  .sheet .in{padding:0 16px 34px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  label.f{display:flex;flex-direction:column;gap:6px}
  label.f>span{font-size:12px;font-weight:600;line-height:16px;color:#4B4F63}
  label.f>span em{font-style:normal;color:#9C9FAF;font-weight:500}
  .f input,.f textarea{width:100%;height:48px;border:0;box-shadow:inset 0 0 0 1px #E1E3EC;border-radius:14px;background:#fff;padding:0 14px;font-size:15px;font-family:inherit;color:#111527;outline:none}
  .f input:focus,.f textarea:focus{box-shadow:inset 0 0 0 2px #3F52B4}
  .f textarea{height:96px;padding:12px 14px;line-height:1.6;resize:none}
  .f input[type=file]{padding:12px 14px;height:auto;font-size:13px;color:#4B4F63}
  .btn{width:100%;height:48px;border:0;border-radius:16px;background:#3F52B4;color:#fff;font-size:16px;font-weight:600;letter-spacing:.02em;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
  .btn:active{background:#323D76}
  .btn.ghost{background:#fff;color:#3F52B4;box-shadow:inset 0 0 0 1px #3F52B4}
  .btn.flat{background:#F2F4FC;color:#3F52B4}
  .btn.off{background:#F2F4FC;color:#9C9FAF;cursor:default}
  .btn.sm{height:40px;font-size:14px;border-radius:12px}
  .btn[disabled]{opacity:.55;cursor:default}
  .msg{display:none;font-size:13px;font-weight:600;line-height:1.6;border-radius:12px;padding:10px 12px;background:#F2F4FC;color:#323D76}
  .msg.on{display:block}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .links{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600;color:#3F52B4}
  .links span{color:#D1D3DB}
  .note{font-size:11px;font-weight:500;line-height:1.6;text-align:center;color:#6B6E80}
  .card{border-radius:16px;background:#F7F7FA;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .card h3{margin:0;font-size:15px;font-weight:700;color:#111527}
  .kv{display:flex;gap:8px;font-size:13px;line-height:1.6}
  .kv b{flex:0 0 82px;font-weight:600;color:#6B6E80}
  .kv span{flex:1;min-width:0;color:#373B51;word-break:break-all}
  .badge{align-self:flex-start;font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;background:#F2F4FC;color:#3F52B4}
  .badge.g{background:#3F52B4;color:#fff}
  .badge.n{background:#EDEDF2;color:#6B6E80}
  .menu{display:flex;flex-direction:column;gap:12px}
  .menu a{min-height:60px;border-radius:16px;background:#F7F7FA;padding:8px 16px;display:flex;align-items:center;gap:16px}
  .menu a .ic{width:40px;height:40px;flex-shrink:0;border-radius:20px;background:#F2F4FC;display:flex;align-items:center;justify-content:center}
  .menu a .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .menu a .tx b{font-size:14px;font-weight:600;line-height:20px;color:#373B51}
  .menu a .tx i{font-style:normal;font-size:12px;line-height:16px;color:#4B4F63}
  .menu a .vl{font-size:14px;font-weight:600;color:#3F52B4;white-space:nowrap}
  .nav{position:absolute;left:0;right:0;bottom:0;height:98px;border-radius:16px 16px 0 0;background:#fff;box-shadow:0 8px 32px rgba(131,139,180,.16);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding:6px 12px 0}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:8px}
  .nav a div{width:38px;height:38px;border-radius:48px;display:flex;align-items:center;justify-content:center}
  .nav a span{font-size:10px;font-weight:600;letter-spacing:.02em;color:#6B6E80}
  .nav a.on div{background:#F2F4FC}
  .nav a.on span{color:#3F52B4}
  .sp{height:4px}
</style>
<script src="./kicon.js?v=1789000000"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./auth.js?v=1789000000"></script>
</head>
<body>
<div class="stage">
<div class="sc" data-screen-label="ガイド申請">
  <div class="hd"><a class="bk" href="login.html"><k-icon name="ArrowRightSize24" size="24" style="color:#373B51;transform:rotate(180deg)"></k-icon></a>가이드 신청</div>
  <div class="bd" id="bd">
    <div id="msg" class="msg"></div>

    <div id="pane-form" style="display:none;flex-direction:column;gap:14px">
      <div class="card">
        <h3>한국 관광통역안내사 가이드 신청</h3>
        <div class="kv"><span style="color:#4B4F63">자격증을 확인한 뒤 승인해 드립니다. 승인 전에는 가이드 화면에 들어갈 수 없습니다.</span></div>
      </div>
      <div id="acct" style="display:none;flex-direction:column;gap:14px">
        <label class="f"><span>이메일 (로그인용)</span><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com"></label>
        <label class="f"><span>비밀번호 <em>(6자 이상)</em></span><input id="pw" type="password" autocomplete="new-password" placeholder="••••••••"></label>
      </div>
      <label class="f"><span>이름</span><input id="nm" type="text" placeholder="홍길동"></label>
      <label class="f"><span>자격증 번호</span><input id="ln" type="text" placeholder="예) 제12-3456호"></label>
      <label class="f"><span>활동 지역</span><input id="ar" type="text" placeholder="예) 서울 · 경기"></label>
      <label class="f"><span>자기소개</span><textarea id="io" placeholder="경력, 안내 가능한 언어, 자신 있는 코스 등"></textarea></label>
      <label class="f"><span>자격증 사진 <em>(jpg · png, 10MB 이하)</em></span><input id="ph" type="file" accept="image/*"></label>
      <button class="btn" id="go">신청서 제출</button>
      <div class="links"><a href="login.html">이미 계정이 있으신 분</a></div>
    </div>

    <div id="pane-state" style="display:none;flex-direction:column;gap:14px">
      <div class="card" style="align-items:center;text-align:center">
        <div style="width:72px;height:72px;border-radius:36px;background:#F2F4FC;display:flex;align-items:center;justify-content:center;align-self:center"><k-icon id="sic" name="ClockSize24" size="36" style="color:#3F52B4"></k-icon></div>
        <h3 id="stt" style="text-align:center"></h3>
        <div class="kv"><span id="ssub" style="color:#4B4F63;text-align:center"></span></div>
      </div>
      <div class="card" id="sapp"></div>
      <a class="btn ghost" href="my.html">마이페이지로</a>
      <button class="btn flat" id="out">로그아웃</button>
    </div>
  </div>
</div>
<script>
(function(){
  var msg=document.getElementById('msg'), go=document.getElementById('go');
  var F=document.getElementById('pane-form'), S=document.getElementById('pane-state');
  function say(t){ msg.textContent=t; msg.className='msg on'; }
  function show(el){ el.style.display='flex'; }

  async function render(){
    var u=await KGA.user();
    if(!u){ document.getElementById('acct').style.display='flex'; show(F); return; }
    var p=await KGA.profile(true);
    if(!p||p.role!=='guide'){ show(F); return; }   // 여행자 계정으로 로그인한 상태 → 신청서만
    var r=await KGA.sb.from('guide_applications').select('*').eq('user_id',u.id).order('id',{ascending:false}).limit(1);
    var a=(r.data&&r.data[0])||null;
    if(!a){ show(F); return; }
    var st=a.status;
    document.getElementById('stt').textContent = st==='approved' ? '승인 완료 / '+KG_TEXT.approvedJa
      : st==='rejected' ? '승인되지 않았습니다' : '심사 중 / 審査中';
    document.getElementById('ssub').innerHTML = st==='approved' ? '이제 '+KG_TEXT.guideKo+' 화면을 이용하실 수 있습니다.'
      : st==='rejected' ? (a.admin_note? '사유: '+a.admin_note : '자세한 내용은 문의해 주세요.')
      : KG_TEXT.pendingKo+'<br>'+KG_TEXT.pendingJa;
    document.getElementById('sic').setAttribute('name', st==='approved'?'TickCircleSize24':(st==='rejected'?'InfoCircleSize24':'ClockSize24'));
    document.getElementById('sapp').innerHTML =
      '<div class="kv"><b>이름</b><span>'+esc(a.name)+'</span></div>'+
      '<div class="kv"><b>자격증 번호</b><span>'+esc(a.license_no)+'</span></div>'+
      '<div class="kv"><b>활동 지역</b><span>'+esc(a.areas)+'</span></div>'+
      '<div class="kv"><b>신청일</b><span>'+(a.created_at||'').slice(0,10)+'</span></div>';
    show(S);
  }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  go.onclick=async function(){
    var nm=document.getElementById('nm').value.trim();
    var ln=document.getElementById('ln').value.trim();
    var ar=document.getElementById('ar').value.trim();
    var io=document.getElementById('io').value.trim();
    var file=document.getElementById('ph').files[0];
    if(!nm||!ln){ say('이름과 자격증 번호를 입력해 주세요.'); return; }
    go.disabled=true; go.textContent='제출 중…';
    try{
      var u=await KGA.user();
      if(!u){
        var em=document.getElementById('em').value.trim(), pw=document.getElementById('pw').value;
        if(!em||pw.length<6){ throw new Error('이메일과 6자 이상의 비밀번호를 입력해 주세요.'); }
        await KGA.signUp(em,pw,{ display_name:nm, role:'guide' });
        u=await KGA.user();
      }
      var path=null;
      if(file){
        if(file.size>10*1024*1024) throw new Error('사진은 10MB 이하로 올려 주세요.');
        var ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
        path=u.id+'/'+Date.now()+'.'+(ext||'jpg');
        var up=await KGA.sb.storage.from('licenses').upload(path,file,{upsert:true});
        if(up.error) throw up.error;
      }
      var ins=await KGA.sb.from('guide_applications').insert({
        user_id:u.id, name:nm, license_no:ln, areas:ar, intro:io, license_photo:path, status:'pending'
      });
      if(ins.error) throw ins.error;
      await KGA.sb.from('profiles').update({ role:'guide', status:'pending', display_name:nm }).eq('id',u.id);
      KGA._profile=null;
      F.style.display='none'; msg.className='msg';
      await render();
    }catch(e){
      say(e.message||'제출하지 못했습니다.');
      go.disabled=false; go.textContent='신청서 제출';
    }
  };
  document.getElementById('out').onclick=async function(){ await KGA.signOut(); location.replace('login.html'); };
  render();
})();
</script>
</div>
</body>
</html>
