<script>
(function(){
  var W=390, H=844;
  var KB=0, NAV=null;
  function navEl(){
    if(NAV && NAV.isConnected) return NAV;
    var d=document.getElementsByTagName('div');
    for(var i=0;i<d.length;i++){ var st=(d[i].getAttribute('style')||'').replace(/\s+/g,'');
      if(st.indexOf('height:98px')>=0 && st.indexOf('bottom:0')>=0){ NAV=d[i]; return NAV; } }
    return null;
  }
  function navHide(on){
    var n=navEl(); if(n){ if(on){ if(n.__d===undefined) n.__d=n.style.display; n.style.display='none'; } else if(n.__d!==undefined){ n.style.display=n.__d; } }
    var b=document.getElementById('kgline'); if(b) b.style.visibility = on ? 'hidden' : '';
  }
  function isField(t){ return t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable); }
  document.addEventListener('focusin', function(e){ if(!isField(e.target)) return; KB=1; navHide(1); });
  document.addEventListener('focusout', function(e){ if(!isField(e.target)) return; KB=0; setTimeout(function(){ if(!KB){ navHide(0); fit(); } }, 150); });
  function fit(){
    if(KB) return;
    var all=document.querySelectorAll('[data-screen-label]'), s=null;
    for(var i=0;i<all.length;i++){ if(!all[i].closest('x-dc')){ s=all[i]; break; } }
    if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }   /* 폰: 폭에 맞추고 세로는 화면 끝까지 */
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }  /* 패드·PC: 가운데에 폰 프레임 */
    s.style.transform='scale('+k+')';
    s.style.margin='0';
  }
  var mo=new MutationObserver(function(){ fit(); });
  document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); fit(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

<script>
(function(){
  var map=null, host=null, wrap=null, ph=null, fs=false;
  var act=false, actT=null, tsx=0, tsy=0, tst=0, moved=false;
  function SPS(){ return (window.KG&&window.KG.spots)||[]; }
  function planIds(){
    var KG=window.KG; if(!KG) return [];
    if(window.KGMAP_IDS){ try{ return window.KGMAP_IDS()||[]; }catch(e){ return []; } }
    var q=new URLSearchParams(location.search).get('id');
    var p={}; try{ p=JSON.parse(localStorage.getItem('kg_plan')||'{}'); }catch(e){}
    if(q && (KG.courses||[]).some(function(c){return c.id===q;})) p={course:q};
    var ids=[];
    if(p.course){ var c=(KG.courses||[]).filter(function(x){return x.id===p.course;})[0]; if(c) ids=String(c.spots).split(',').map(function(s){return s.trim();}).filter(Boolean); }
    else ids=(p.spots||[]);
    if(!ids.length && !p.course && !Array.isArray(p.spots)){ var c0=(KG.courses||[])[0]; ids=c0?String(c0.spots).split(',').map(function(s){return s.trim();}).filter(Boolean):[]; }
    return ids;
  }
  function hav(a,b){ var R=6371000, t=Math.PI/180, dLa=(b[0]-a[0])*t, dLn=(b[1]-a[1])*t;
    var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLn/2)*Math.sin(dLn/2);
    return 2*R*Math.asin(Math.min(1,Math.sqrt(s))); }
  function pinIcon(n){ return L.divIcon({className:'', iconSize:[28,28], iconAnchor:[14,14],
    html:'<div style="width:28px;height:28px;border-radius:50%;background:#3F52B4;color:#fff;font-family:Poppins,sans-serif;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(17,21,41,.30);">'+n+'</div>'}); }
  function legIcon(txt,col){ return L.divIcon({className:'', iconSize:[0,0], iconAnchor:[0,0],
    html:'<div style="transform:translate(-50%,-50%);display:inline-block;white-space:nowrap;padding:2px 7px;border-radius:9px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(17,21,41,.18);color:'+col+';font-size:10px;font-weight:600;">'+txt+'</div>'}); }
  function pick(){
    var els=document.querySelectorAll('#kgmap'), out=null;
    for(var i=0;i<els.length;i++){ if(els[i].closest('x-dc')) continue; var r=els[i].getBoundingClientRect(); if(r.width>0&&r.height>0) out=els[i]; }
    return out;
  }
  function hintEl(){ var e=document.querySelectorAll('#kgmaphint'), o=null; for(var i=0;i<e.length;i++){ if(e[i].closest('x-dc')) continue; o=e[i]; } return o; }
  function paint(){
    if(wrap && !fs) wrap.style.boxShadow = act ? 'inset 0 0 0 2px #3F52B4' : 'none';
    var h=hintEl(); if(h) h.style.display = (act||fs) ? 'none' : 'flex';
    if(host) host.style.touchAction = act ? 'none' : 'auto';
  }
  function bump(){ clearTimeout(actT); actT=setTimeout(function(){ setAct(false); }, 10000); }
  function setAct(v){
    v=!!v;
    if(act===v){ if(v) bump(); return; }
    act=v;
    if(map){ try{
      if(v){ map.dragging.enable(); map.touchZoom.enable(); map.scrollWheelZoom.enable(); }
      else { map.dragging.disable(); map.touchZoom.disable(); map.scrollWheelZoom.disable(); }
    }catch(e){} }
    paint();
    if(v) bump(); else { clearTimeout(actT); actT=null; }
  }
  function inMap(t){ return !!(t && t.closest && t.closest('#kgmap')); }
  document.addEventListener('touchstart', function(e){
    if(inMap(e.target)){
      if(e.touches && e.touches.length>=2){ setAct(true); return; }
      var t=e.touches&&e.touches[0]; if(t){ tsx=t.clientX; tsy=t.clientY; }
      tst=Date.now(); moved=false;
      if(act) bump();
    } else if(!(e.target&&e.target.closest&&e.target.closest('#kgmapfs'))) setAct(false);
  }, true);
  document.addEventListener('touchmove', function(e){
    if(!inMap(e.target)) return;
    if(e.touches && e.touches.length>=2){ setAct(true); return; }
    var t=e.touches&&e.touches[0]; if(!t) return;
    if(Math.abs(t.clientX-tsx)>10 || Math.abs(t.clientY-tsy)>10) moved=true;
    if(act) bump();
  }, true);
  document.addEventListener('touchend', function(e){
    if(!inMap(e.target)) return;
    if(!moved && Date.now()-tst<600) setAct(true);
  }, true);
  document.addEventListener('mousedown', function(e){
    if(inMap(e.target)){ if(act) bump(); else setAct(true); }
    else if(!(e.target&&e.target.closest&&e.target.closest('#kgmapfs'))) setAct(false);
  }, true);
  function draw(){
    var el=pick();
    if(!el||!window.L||!window.KG) return;
    if(el===host&&map) return;
    if(map){ try{ map.remove(); }catch(e){} map=null; }
    host=el; wrap=el.parentNode;
    map=L.map(el,{zoomControl:true, attributionControl:true, dragging:false, touchZoom:false, scrollWheelZoom:false, tap:false});
    act=false; clearTimeout(actT); actT=null; paint();
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
    var sp=planIds().map(function(id){ var f=SPS().filter(function(s){return s.id===id;}); return f[0]; }).filter(function(s){ return s&&s.lat&&s.lng; });
    var pts=sp.map(function(s){ return [parseFloat(s.lat), parseFloat(s.lng)]; });
    if(!pts.length){ map.setView([37.5665,126.9780],12); return; }
    if(pts.length>1) L.polyline(pts,{color:'#3F52B4',weight:3,opacity:.8,dashArray:'6 7'}).addTo(map);
    pts.forEach(function(pt,i){ L.marker(pt,{icon:pinIcon(i+1)}).addTo(map).bindPopup('<b>'+(sp[i].name||'')+'</b>'); });
    for(var i=0;i<pts.length-1;i++){
      var d=hav(pts[i],pts[i+1])*1.3, mid=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2], txt, col;
      if(d>1500){ txt='地下鉄・バス · '+(d/1000).toFixed(1)+'km'; col='#B22459'; }
      else { txt='徒歩 '+Math.max(1,Math.round(d/80))+'分 · '+(Math.round(d/50)*50)+'m'; col='#3F52B4'; }
      L.marker(mid,{icon:legIcon(txt,col), interactive:false, zIndexOffset:-200}).addTo(map);
    }
    map.__kgb = L.latLngBounds(pts);
    map.fitBounds(map.__kgb,{padding:[40,40], maxZoom:16});
  }
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('#kgmapfs');
    if(!b || !wrap) return;
    var screen=document.querySelector('[data-screen-label]'); if(!screen) return;
    if(!fs){
      ph=document.createComment('kgmap'); wrap.parentNode.insertBefore(ph, wrap);
      wrap.style.cssText='position:absolute; left:0; top:0; right:0; bottom:0; z-index:9000; border-radius:0; overflow:hidden; background:#F2F4FC;';
      screen.appendChild(wrap); b.textContent='閉じる'; fs=true;
      setAct(true); paint();
    } else {
      fs=false;
      wrap.style.cssText='position:relative; height:230px; border-radius:16px; overflow:hidden; background:#F2F4FC;';
      ph.parentNode.insertBefore(wrap, ph); ph.parentNode.removeChild(ph); ph=null;
      b.textContent='全画面';
      setAct(false); paint();
    }
    setTimeout(function(){ if(map){ map.invalidateSize(); if(map.__kgb) map.fitBounds(map.__kgb,{padding:[40,40], maxZoom:16}); } }, 60);
  }, true);
  window.addEventListener('kgplan', function(){ if(map){ try{ map.remove(); }catch(e){} } map=null; host=null; draw(); });
  setInterval(draw, 400);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', draw); else draw();
})();
</script>
<script>
(function(){
  var U='https://line.me/R/ti/p/@897fvigb'; if(!U) return;
  var b=document.createElement('a'); b.href=U; b.target='_blank'; b.rel='noopener'; b.id='kgline';
  b.setAttribute('aria-label','LINEで相談');
  b.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.7L3 21l1.8-4.2A8.4 8.4 0 0 1 3 11.5C3 6.8 7 3 12 3s9 3.8 9 8.5z"/></svg><span style="font-size:9px;font-weight:700;letter-spacing:.5px;line-height:1;margin-top:1px">LINE</span>';
  b.style.cssText='position:absolute; right:16px; bottom:114px; z-index:700; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; width:56px; height:56px; border-radius:50%; background:#06C755; color:#fff; text-decoration:none; box-shadow:0 8px 32px rgba(17,21,41,.22);';
  function place(s){
    var sr=s.getBoundingClientRect(), top=sr.bottom;
    Array.prototype.forEach.call(s.children, function(c){
      if(c===b) return;
      var st=getComputedStyle(c); if(st.position!=='absolute'&&st.position!=='fixed') return;
      var r=c.getBoundingClientRect();
      if(r.height>0 && r.height<260 && r.bottom>sr.bottom-260 && r.bottom<=sr.bottom+2) top=Math.min(top, r.top);
    });
    b.style.bottom = Math.round(Math.max(16, sr.bottom-top+16)) + 'px';
  }
  function screenEl(){ var a=document.querySelectorAll('[data-screen-label]'), out=null;
    for(var i=0;i<a.length;i++){ if(a[i].closest('x-dc')) continue; var r=a[i].getBoundingClientRect(); if(r.width>0&&r.height>0) out=a[i]; }
    return out; }
  function mount(){ var s=screenEl(); if(!s) return; if(b.parentNode!==s) s.appendChild(b); place(s); }
  setInterval(mount, 700);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', function(){
    b.style.display = (window.visualViewport.height < window.innerHeight*0.75) ? 'none' : 'inline-flex'; }); }
})();
</script>
