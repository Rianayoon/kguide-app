<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3F52B4">
<title>K-GUIDE</title>
<style>
  html, body { margin:0; background:#F2F4FC; min-height:100%; }
</style>
<script>
(function(){
  var W=390, H=844;
  function fit(){
    var all=document.querySelectorAll('[data-screen-label]'), s=null;
    for(var i=0;i<all.length;i++){ if(!all[i].closest('x-dc')){ s=all[i]; break; } }
    if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }   /* 폰: 폭에 맞추고 세로는 화면 끝까지 */
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }  /* 패드·PC: 가운데에 폰 프레임 */
    s.style.transform='scale('+k+')';
    s.style.margin='0';
  }
  var mo=new MutationObserver(function(){ fit(); });
  document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); fit(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

<script src="https://kguide-rt.vercel.app/support.js"></script>
<script src="./data.js"></script>

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap">
  <style>
    body { margin:0; background:#FAFAFA; font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:#111527; }
    a { color:#3F52B4; text-decoration:none; } a:hover { color:#323D76; }
    ::-webkit-scrollbar { display:none; }
  </style>
  <script src="./kicon.js"></script>
</helmet>
<div data-screen-label="プラン編集" style="position:relative; width:390px; height:844px; margin:0 auto; background:#fff; overflow:hidden; display:flex; flex-direction:column;">

  <div style="flex-shrink:0; padding:16px; display:flex; align-items:center; gap:12px;">
    <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
      <div style="font-size:16px; font-weight:600; line-height:24px; color:#373B51;">順番を決める</div>
      <div style="font-size:11px; font-weight:500; color:#6B6E80;">つかんで並べ替え · − で削除</div>
    </div>
    <a href="plan.html" style="height:40px; padding:0 16px; flex-shrink:0; border-radius:16px; background:#F2F4FC; color:#3F52B4; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; text-decoration:none;">完了</a>
  </div>

  <div style="flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:16px; padding:0 16px 200px;">

    <div style="flex-shrink:0; border-radius:16px; background:#F2F4FC; padding:14px 16px; display:flex; align-items:center; gap:12px;">
      <k-icon name="InfoCircleSize24" size="22" style="color:#3F52B4"></k-icon>
      <div style="flex:1; font-size:12px; font-weight:500; line-height:1.6; color:#111527;">明洞のホテルを起点に、徒歩と地下鉄で回れる順番に並べています。</div>
    </div>

    <sc-for list="{{ stops }}" as="s" hint-placeholder-count="4">
      <div style="flex-shrink:0; min-height:104px; box-sizing:border-box; border-radius:16px; background:#F7F7FA; padding:8px; display:flex; align-items:center; gap:6px;">
        <div style="width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:grab;">
          <div style="display:grid; grid-template-columns:3px 3px; gap:4px;">
            <span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span><span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span>
            <span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span><span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span>
            <span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span><span style="width:3px; height:3px; border-radius:50%; background:#9C9FAF;"></span>
          </div>
        </div>
        <div style="width:24px; height:24px; flex-shrink:0; border-radius:12px; background:#3F52B4; color:#fff; font-family:Poppins,sans-serif; font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:center;">{{ s.n }}</div>
        <div style="width:56px; height:56px; flex-shrink:0; border-radius:8px; background:{{ s.photo }};"></div>
        <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;">
          <div style="font-size:14px; font-weight:600; line-height:20px; color:#373B51; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ s.name }}</div>
          <div style="font-size:12px; font-weight:500; line-height:16px; color:#6B6E80;">滞在 {{ s.stay }} · 徒歩 <span style="font-family:Poppins,sans-serif;">{{ s.walk }}</span>分</div>
        </div>
        <div style="display:flex; flex-direction:column; flex-shrink:0;">
          <div onClick="{{ s.onUp }}" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer;"><div style="width:28px; height:28px; border-radius:14px; background:{{ s.upBg }}; display:flex; align-items:center; justify-content:center;"><k-icon name="ArrowRightSize20" size="20" style="color:{{ s.upFg }}; transform:rotate(-90deg)"></k-icon></div></div>
          <div onClick="{{ s.onDown }}" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer;"><div style="width:28px; height:28px; border-radius:14px; background:{{ s.downBg }}; display:flex; align-items:center; justify-content:center;"><k-icon name="ArrowRightSize20" size="20" style="color:{{ s.downFg }}; transform:rotate(90deg)"></k-icon></div></div>
        </div>
        <div onClick="{{ s.onRemove }}" style="width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;"><div style="width:28px; height:28px; border-radius:14px; background:#fff; display:flex; align-items:center; justify-content:center;"><k-icon name="MinusSize20" size="20" style="color:#B22459"></k-icon></div></div>
      </div>
    </sc-for>

    <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="flex-shrink:0; border-radius:16px; background:#F7F7FA; padding:32px 16px; display:flex; flex-direction:column; align-items:center; gap:8px;">
        <k-icon name="RoutingSize24" size="32" style="color:#9C9FAF"></k-icon>
        <div style="font-size:14px; font-weight:600; line-height:20px; color:#373B51;">スポットがありません</div>
        <div style="font-size:12px; font-weight:400; line-height:16px; text-align:center; color:#4B4F63;">「さがす」からスポットを追加してください</div>
      </div>
    </sc-if>

    <a href="search.html" style="flex-shrink:0; box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:8px; height:56px; border-radius:16px; background:#fff; border:1.5px dashed #3F52B4; color:#3F52B4; font-size:16px; font-weight:600; letter-spacing:.02em; text-decoration:none;"><k-icon name="AddSize20" size="20" style="color:#3F52B4"></k-icon>スポットを追加</a>

    <sc-if value="{{ removed }}" hint-placeholder-val="{{ false }}">
      <div style="flex-shrink:0; border-radius:16px; background:#fff; box-shadow:inset 0 0 0 1px #D1D3DB; padding:14px 16px; display:flex; align-items:center; gap:12px;">
        <div style="flex:1; font-size:12px; font-weight:500; color:#4B4F63;">「{{ removed }}」を削除しました</div>
        <div onClick="{{ undo }}" style="font-size:14px; font-weight:600; color:#3F52B4; cursor:pointer;">元に戻す</div>
      </div>
    </sc-if>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:98px; padding:12px 16px; box-sizing:border-box; background:#fff; box-shadow:0 -8px 24px rgba(131,139,180,.10); display:flex; flex-direction:column; gap:8px;">
    <div style="display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:500; color:#6B6E80;">
      <span><span style="font-family:Poppins,sans-serif; color:#111527;">{{ count }}</span> スポット</span>
      <span>合計 徒歩 <span style="font-family:Poppins,sans-serif; color:#111527;">{{ totalWalk }}</span>分</span>
    </div>
    <a href="plan.html" style="display:flex; align-items:center; justify-content:center; gap:8px; height:48px; border-radius:16px; background:#3F52B4; color:#fff; font-size:16px; font-weight:600; letter-spacing:.02em; text-decoration:none;"><k-icon name="TickCircleSize24" size="20" style="color:#fff"></k-icon>この順番で保存</a>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; height:98px; border-radius:16px 16px 0 0; background:#fff; box-shadow:0 8px 32px rgba(131,139,180,.16); display:grid; grid-template-columns:repeat(5,1fr); align-items:start; padding:6px 12px 0; box-sizing:border-box;">
    <a href="home.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="HomeSize24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">ホーム</span></a>
    <a href="search.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="SearchNormal2Size24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">さがす</span></a>
    <a href="plan.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; background:#F2F4FC; display:flex; align-items:center; justify-content:center;"><k-icon name="RoutingSize24" size="24" style="color:#3F52B4"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#3F52B4;">プラン</span></a>
    <a href="help.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="MessagesSize24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">ヘルプ</span></a>
    <a href="my.html" style="display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none;"><div style="width:38px; height:38px; border-radius:48px; display:flex; align-items:center; justify-content:center;"><k-icon name="UserSize24" size="24" style="color:#6B6E80"></k-icon></div><span style="font-size:10px; font-weight:600; letter-spacing:.02em; color:#6B6E80;">マイページ</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
const WM = {"Bukchon-ro_11-gil_street_with_hanok_houses_and_blue_sky_in_Bukchon_Hanok_Village_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/17/3537917_image1_1.jpg", "Bukchon-ro_11-gil_street_with_hanok_houses_at_sunrise_in_Bukchon_Hanok_Village_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/17/3537917_image1_1.jpg", "Bukchon_Village_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/17/3537917_image1_1.jpg", "Front_view_of_Heungnyemun_Gate_in_Gyeongbokgung_Palace_Seoul_South_Korea.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/05/3551005_image1_1.jpg", "Front_view_of_the_Imperial_Throne_Hall_Geunjeongjeon_at_Gyeongbokgung_Palace_with_blue_sky_in_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/05/3551005_image1_1.jpg", "Front_view_of_Jibokjae_Hall_under_blue_sky_at_Gyeongbokgung_Palace_in_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/62/4061962_image2_1.jpg", "Gwanghwamun_20240413.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/03/3551103_image1_1.jpg", "Insadong_Street_in_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/87/2546387_image2_1.jpg", "Myeongdong_Cathedral_6.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/05/1939005_image2_1.jpg", "Myeongdong_at_night.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/45/2588645_image2_1.jpg", "Myeongdong_Neon_at_Night,_Seoul.jpg": "https://tong.visitkorea.or.kr/cms/resource_photo/45/2588645_image2_1.jpg", "Tteokbokki.JPG": "https://tong.visitkorea.or.kr/cms/resource_photo/67/2540167_image2_1.jpg"};
const photo = (file) => `url('${WM[file] || ''}') center / cover no-repeat`;

const INITIAL = [
  { id: 1, name: '景福宮', stay: '90分', walk: 12, photo: photo('Front_view_of_Heungnyemun_Gate_in_Gyeongbokgung_Palace_Seoul_South_Korea.jpg') },
  { id: 2, name: '北村韓屋村', stay: '60分', walk: 9, photo: photo('Bukchon_Village_Seoul.jpg') },
  { id: 3, name: '仁寺洞', stay: '80分', walk: 17, photo: photo('Insadong_Street_in_Seoul.jpg') },
  { id: 4, name: '明洞のホテルへ戻る', stay: '—', walk: 6, photo: photo('Myeongdong_at_night.jpg') },
];

class Component extends DCLogic {
  state = { list: INITIAL, removed: null };

  move(i, d) {
    this.setState(s => {
      const list = [...s.list];
      const j = i + d;
      if (j < 0 || j >= list.length) return null;
      [list[i], list[j]] = [list[j], list[i]];
      return { list };
    });
  }

  renderVals() {
    const list = this.state.list;
    return {
      count: list.length,
      totalWalk: list.reduce((a, s) => a + s.walk, 0),
      isEmpty: list.length === 0,
      removed: this.state.removed ? this.state.removed.item.name : '',
      undo: () => this.setState(s => {
        if (!s.removed) return null;
        const list = [...s.list];
        list.splice(s.removed.index, 0, s.removed.item);
        return { list, removed: null };
      }),
      stops: list.map((s, i) => ({
        ...s,
        n: i + 1,
        upBg: i === 0 ? 'transparent' : '#fff',
        upFg: i === 0 ? '#D1D3DB' : '#3F52B4',
        downBg: i === list.length - 1 ? 'transparent' : '#fff',
        downFg: i === list.length - 1 ? '#D1D3DB' : '#3F52B4',
        onUp: () => this.move(i, -1),
        onDown: () => this.move(i, 1),
        // 되돌리기는 삭제 시점의 위치로 복원한다(사용자가 본 그 자리).
        onRemove: () => this.setState(st => ({
          list: st.list.filter((_, k) => k !== i),
          removed: { index: i, item: s },
        })),
      })),
    };
  }
}
</script>
</body>
</html>
