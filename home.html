<script>
(function(){
  var W=390, H=844;
  function fit(){
    var all=document.querySelectorAll('[data-screen-label]'), s=null;
    for(var i=0;i<all.length;i++){ if(!all[i].closest('x-dc')){ s=all[i]; break; } }
    if(!s) return;
    var vw=window.innerWidth, vh=window.innerHeight;
    var stage=s.parentNode; if(!stage||stage===document.body){ return; }
    stage.style.cssText='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;';
    s.style.flexShrink='0'; s.style.transformOrigin='center center';
    var k;
    if(vw<=430){ k=vw/W; s.style.height=Math.round(vh/k)+'px'; s.style.boxShadow='none'; }   /* 폰: 폭에 맞추고 세로는 화면 끝까지 */
    else { k=Math.min(vw/W, vh/H); s.style.height=H+'px'; s.style.boxShadow='0 8px 40px rgba(17,21,41,.10)'; }  /* 패드·PC: 가운데에 폰 프레임 */
    s.style.transform='scale('+k+')';
    s.style.margin='0';
  }
  var mo=new MutationObserver(function(){ fit(); });
  document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); fit(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
})();
</script>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;holidayBanner&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;ホーム&quot;},&quot;liveCamera&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;ホーム&quot;}}">


const KG = window.KG; const SP = KG.spots;
const FAV = { get() { try { return JSON.parse(localStorage.getItem('kg_fav') || '[]'); } catch (e) { return []; } }, has(id) { return FAV.get().includes(id); }, toggle(id) { const l = FAV.get(); const i = l.indexOf(id); if (i >= 0) l.splice(i, 1); else l.unshift(id); try { localStorage.setItem('kg_fav', JSON.stringify(l)); } catch (e) {} return i < 0; } };
const stopNav = (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } };
const byId = (id) => SP.find(s => s.id === id);
const bg = (u, w) => u ? `url('${u}') center / cover no-repeat` : 'linear-gradient(135deg,#E9ECF8,#D1D6EE)';
const shot = (u) => `linear-gradient(180deg, rgba(17,21,41,0) 45%, rgba(17,21,41,0.8) 100%), ${bg(u)}`;
const qid = () => new URLSearchParams(location.search).get('id');
const DOW = ['日','月','火','水','木','金','土'];
const KR_HOLI = new Set(['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-05','2026-05-24','2026-05-25','2026-06-06','2026-08-15','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09','2026-12-25','2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-03-01','2027-05-05','2027-05-13','2027-06-06','2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-03','2027-10-04','2027-10-09','2027-12-25']);
const SEOL = {day: ['2026-02-17','2027-02-07'], run: ['2026-02-16','2026-02-17','2026-02-18','2027-02-06','2027-02-07','2027-02-08']};
const CHUSEOK = {day: ['2026-09-25','2027-09-15'], run: ['2026-09-24','2026-09-25','2026-09-26','2027-09-14','2027-09-15','2027-09-16']};
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function closedOn(r, d) {
  r = r || ''; if (!r) return false;
  if (/年中無休|無休|年中開放|年中運航|休みなし/.test(r) && !/店舗により|一部/.test(r)) return false;
  const key = ymd(d), dow = DOW[d.getDay()], isHoli = KR_HOLI.has(key);
  const r1 = r.replace(/第\d月曜日?/g, ''), r2 = r1.replace(/[（(][^）)]*[）)]/g, '').replace(/[^、,／/]*祝日の(場合|次|翌|時)[^、,／/]*/g, '');
  const wd = new Set((r1.match(/[月火水木金土日](?=曜)/g) || [])); if (/週末/.test(r)) { wd.add('土'); wd.add('日'); }
  if (/祝日|公休日|祝祭日/.test(r2) && isHoli) return true;
  if (/1月1日/.test(r) && key.endsWith('-01-01')) return true;
  if (/12月25日/.test(r) && key.endsWith('-12-25')) return true;
  if (/5月1日/.test(r) && key.endsWith('-05-01')) return true;
  const run = /連休/.test(r);
  if (/ソルナル|ソルラル|旧正月|旧暦1月1日/.test(r) && (run ? SEOL.run : SEOL.day).includes(key)) return true;
  if (/秋夕|旧暦8月15日/.test(r) && (run ? CHUSEOK.run : CHUSEOK.day).includes(key)) return true;
  if (/第1月曜/.test(r) && dow === '月' && d.getDate() <= 7) { const ms = (r.match(/(\d{1,2})月/g) || []).map(x => parseInt(x)); if (!ms.length || ms.includes(d.getMonth() + 1)) return true; }
  if (wd.has(dow)) {
    if (/祝日の場合|祝日は開|祝日の時|祝日と重なる/.test(r) && isHoli) return false;   // 휴관요일이 공휴일이면 개관
    return true;
  }
  if (/翌日|翌平日|次の平日/.test(r)) { const y = new Date(d); y.setDate(y.getDate() - 1); if (wd.has(DOW[y.getDay()]) && KR_HOLI.has(ymd(y))) return true; }
  return false;
}
function isClosedToday(s){ return closedOn(s.rest, new Date()); }
const OPEN = { dot: '#047857', open: '開館中', openFg: '#047857' };
const SHUT = { dot: '#B22459', open: '本日休館', openFg: '#B22459' };
const st = (s) => isClosedToday(s) ? SHUT : OPEN;
const metaOf = (s) => [s.jp ? '日本語対応' : '', s.stay ? `約${s.stay}分` : '', s.fee && s.fee.length < 22 ? s.fee : '', s.area].filter(Boolean).slice(0,2).join(' · ');


class Component extends DCLogic {
  renderVals() {
    const open = { dot: '#047857', subColor: '#6B6E80' };
    const closed = { dot: '#B22459', subColor: '#B22459' };
    return {
      holidayBanner: this.props.holidayBanner ?? true,
      liveCamera: this.props.liveCamera ?? true,
      areas: [['鍾路 · 光化門','景福宮エリア'],['明洞','明洞'],['北村 · 三清洞','北村'],['弘大','弘大']].map(([k, label]) => { const list = SP.filter(x => x.areaKey === k); const pic = (list.find(x => x.photo) || {}).photo; return { name: label, sub: `スポット ${list.length}件`, bg: shot(pic), href: 'search.html?area=' + encodeURIComponent(k) }; }),
      openings: SP.filter(x => x.type === '名所' && x.hours).slice(0, 5).map(x => { const c = isClosedToday(x); return { name: x.name, hours: c ? '本日休館' : x.hours.split(/[ （(]/)[0].slice(0, 18), ...(c ? closed : open), href: 'spot.html?id=' + x.id }; }),
      cams: [
        { name: '明洞', crowd: 'やや混雑', bg: shot('Myeongdong_at_night.jpg') },
        { name: '景福宮', crowd: '空いている', bg: shot('Gyeongbokgung(palace)_Geunjeongjeon(hall).jpg') },
      ],
    };
  }
}

</script>
