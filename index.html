<!DOCTYPE html><html><head><meta charset="utf-8"><title>K-GUIDE</title><script>
(function(){
  var L='';
  try{ L=localStorage.getItem('kg_lang')||''; }catch(e){}
  if(!L){ var n=(navigator.language||'').toLowerCase(); L = n.indexOf('ko')===0 ? 'ko' : 'ja'; }
  if(L!=='ko') L='ja';
  location.replace(L==='ja' ? 'home.html' : L+'/home.html');
})();
</script><noscript><meta http-equiv="refresh" content="0; url=home.html"></noscript></head><body></body></html>
